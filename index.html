    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>
  <script type="text/babel">
// personal.jsx — visitor personalisation layer ("the site that adapts to you").
// Everything is per-visitor, stored ONLY in their browser's localStorage —
// nothing is sent anywhere, nothing is baked into the public build.
// Features: visit memory (adaptive intro), time-of-day greeting, a two-step
// guide (who are you → what are you looking for) that routes the visitor to
// the right proof and pitches the fit, a director's-commentary strip, and a
// persistent "?" help button to reopen the guide anytime.

// ── Button sizer ──────────────────────────────────────────────
// Edit mode: hover ANY button or link → a small − % ＋ chip appears; adjust
// in 10% steps (reset returns to normal). Sizes are keyed by button text,
// persist, and bake into the public build (where the chip never exists).
(function () {
  var KEY = 'pp-btn-sizes';
  setTimeout(function () {
    var map = {};
    try { var raw = localStorage.getItem(KEY); if (raw) map = JSON.parse(raw) || {}; } catch (e) {}
    if (!Object.keys(map).length) {
      try { var st = window.__PP_EMBED__ && window.__PP_EMBED__.state; if (st && st[KEY]) map = JSON.parse(st[KEY]) || {}; } catch (e) {}
    }
    function slugOf(el) {
      var t = (el.textContent || '').trim().toLowerCase().replace(/\s+/g, ' ').slice(0, 48);
      return t ? 'btn|' + t : null;
    }
    function applyAll() {
      if (!Object.keys(map).length) return;
      document.querySelectorAll('button, a').forEach(function (el) {
        if (el.closest('#pp-btnchip')) return;
        var s = slugOf(el);
        if (s && map[s]) el.style.zoom = map[s];
      });
    }
    applyAll();
    var t0 = null;
    var mo = new MutationObserver(function () { clearTimeout(t0); t0 = setTimeout(applyAll, 150); });
    mo.observe(document.body, { childList: true, subtree: true });

    if (!window.PP_EDITABLE) return;

    var chip = document.createElement('div');
    chip.id = 'pp-btnchip';
    chip.style.cssText = 'position:fixed;z-index:4000;display:none;align-items:center;gap:5px;padding:5px 8px;border-radius:99px;border:1px solid rgba(255,255,255,0.25);background:rgba(8,4,14,0.94);backdrop-filter:blur(10px);font:10px "JetBrains Mono",monospace;color:#fff;letter-spacing:0.08em;box-shadow:0 8px 30px rgba(0,0,0,0.5)';
    chip.innerHTML = '<button data-d="-1" title="Smaller" style="all:unset;cursor:pointer;width:18px;height:18px;text-align:center;border-radius:50%;background:rgba(255,255,255,0.14)">−</button><span data-l style="min-width:34px;text-align:center"></span><button data-d="1" title="Bigger" style="all:unset;cursor:pointer;width:18px;height:18px;text-align:center;border-radius:50%;background:rgba(255,255,255,0.14)">＋</button><button data-r title="Reset size" style="all:unset;cursor:pointer;padding:0 3px;opacity:0.65">reset</button>';
    document.body.appendChild(chip);
    var target = null, slugT = null;
    function labl() { chip.querySelector('[data-l]').textContent = Math.round((map[slugT] || 1) * 100) + '%'; }
    function place() {
      if (!target) return;
      var r = target.getBoundingClientRect();
      chip.style.left = Math.max(6, Math.min(window.innerWidth - 170, r.left)) + 'px';
      chip.style.top = Math.max(6, r.top - 32) + 'px';
    }
    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(map)); } catch (e) {}
      if (window.PPStore) window.PPStore.persist(KEY);
    }
    chip.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b || !target) return;
      e.stopPropagation(); e.preventDefault();
      if (b.hasAttribute('data-r')) { delete map[slugT]; target.style.zoom = ''; }
      else {
        var z = (map[slugT] || 1) + 0.1 * parseInt(b.getAttribute('data-d'), 10);
        z = Math.max(0.5, Math.min(2.5, Math.round(z * 10) / 10));
        map[slugT] = z; target.style.zoom = z;
      }
      save(); labl(); place(); applyAll();
    });
    document.addEventListener('mouseover', function (e) {
      if (chip.contains(e.target)) return;
      var b = e.target.closest && e.target.closest('button, a');
      if (!b || chip.contains(b)) return;
      var s = slugOf(b);
      if (!s) return;
      target = b; slugT = s; labl(); place();
      chip.style.display = 'flex';
    }, true);
    document.addEventListener('mousemove', function (e) {
      if (!target || chip.style.display === 'none') return;
      var pad = 44;
      var r = target.getBoundingClientRect(), c = chip.getBoundingClientRect();
      var inR = e.clientX > r.left - pad && e.clientX < r.right + pad && e.clientY > r.top - pad && e.clientY < r.bottom + pad;
      var inC = e.clientX > c.left - 10 && e.clientX < c.right + 10 && e.clientY > c.top - 10 && e.clientY < c.bottom + 10;
      if (!inR && !inC) { chip.style.display = 'none'; target = null; }
    });
    window.addEventListener('scroll', function () { chip.style.display = 'none'; target = null; }, true);
  }, 400);
})();

// ── Visit memory ──────────────────────────────────────────────
const PPVisit = {
  KEY: 'pp-visitor',
  load() { try { return JSON.parse(localStorage.getItem(this.KEY)) || {}; } catch (e) { return {}; } },
  save(v) { try { localStorage.setItem(this.KEY, JSON.stringify(v)); } catch (e) {} },
  begin() {
    const v = this.load();
    const now = Date.now();
    if (!v.seen || now - v.seen > 30 * 60 * 1000) v.visits = (v.visits || 0) + 1;
    v.seen = now;
    v.pages = v.pages || {};
    v.cases = v.cases || [];
    this.save(v);
    return v;
  },
  recordPage(page, id) {
    const v = this.load();
    v.pages = v.pages || {};
    v.pages[page] = (v.pages[page] || 0) + 1;
    if (page === 'case' && id) { v.cases = v.cases || []; if (!v.cases.includes(id)) v.cases.push(id); }
    this.save(v);
    window.dispatchEvent(new CustomEvent('pp-visit'));
    return v;
  },
  setLens(l) { const v = this.load(); v.lens = l; v.lensAsked = !!l; if (l) v.lensJustSet = true; this.save(v); window.dispatchEvent(new CustomEvent('pp-lens')); },
  lens() { return this.load().lens || null; },
  setPitch(roleId) { const v = this.load(); v.pitch = roleId; v.lensJustSet = false; this.save(v); },
  returning() { return (this.load().visits || 1) > 1; }
};
PPVisit.begin();
window.PPVisit = PPVisit;

// ── Time-of-day greeting ──────────────────────────────────────
const PPGreeting = () => {
  const h = new Date().getHours();
  if (h < 5) return 'Working late';
  if (h < 12) return 'Good morning';
  if (h < 18) return 'Good afternoon';
  return 'Good evening';
};
window.PPGreeting = PPGreeting;

// ── Lens hook ─────────────────────────────────────────────────
const usePPLens = () => {
  const [lens, set] = React.useState(() => PPVisit.lens());
  React.useEffect(() => {
    const on = () => set(PPVisit.lens());
    // Re-sync after PPStore hydration too: mount can happen before the saved
    // state is seeded into localStorage, so also listen to 'pp-visit' (fired
    // on every route change) and re-read once shortly after mount.
    window.addEventListener('pp-lens', on);
    window.addEventListener('pp-visit', on);
    const t = setTimeout(on, 800);
    return () => { window.removeEventListener('pp-lens', on); window.removeEventListener('pp-visit', on); clearTimeout(t); };
  }, []);
  return lens;
};
window.usePPLens = usePPLens;

const LENSES = [
  { id: 'hiring', label: "I'm hiring", strip: 'RECRUITER VIEW' },
  { id: 'client', label: 'I have a project', strip: 'CLIENT VIEW' },
  { id: 'browsing', label: 'Just exploring', strip: 'VISITOR VIEW' }];

// ── The roles I can be hired for — each routes to its proof and
//    pitches the fit in a warm, human line once you land there.
const PP_ROLES = [
  { id: 'direction', label: 'Creative direction', go: { page: 'work' },
    pitch: 'Creative direction is the day job. I\u2019ve worked hands-on in every craft that sits under the vision, which helps the idea survive all the way to the screen. The work is right here' },
  { id: 'production', label: 'Video & media production', go: { page: 'work' },
    pitch: 'Then you\u2019ll want the showreel above. I shoot, edit, grade and deliver in-house, start to finish' },
  { id: 'marketing', label: 'Marketing & content', go: { page: 'work' },
    pitch: 'The marketing work lives in the first card: a global tech brand, an energy drink from zero, and more. Have a look and see what you think' },
  { id: 'events', label: 'Live events, podcasts & audio', go: { page: 'case', id: 'pwc-live-av' },
    pitch: 'Live work is where I feel most at home. Here\u2019s what that looks like in practice' },
  { id: 'other', label: 'Something else', go: { page: 'services' },
    pitch: 'The short version: I direct, film, photograph, design, mix and market. Here\u2019s the full menu, and if something isn\u2019t on it, it never hurts to ask' }];

// ── Guide — two friendly questions, multichoice only ──────────
const GuidePicker = ({ setRoute, onClose, startStep }) => {
  const [step, setStep] = React.useState(startStep || (PPVisit.lens() ? 'role' : 'lens'));
  const [leaving, setLeaving] = React.useState(false);
  const close = () => { setLeaving(true); setTimeout(onClose, 320); };
  const pickLens = (id) => { PPVisit.setLens(id); setStep('role'); };
  const pickRole = (r) => {
    PPVisit.setPitch(r.id);
    setRoute(r.go);
    window.scrollTo(0, 0);
    close();
  };
  return (
    <div className="lens-pick" style={{ opacity: leaving ? 0 : 1, transform: leaving ? 'translateY(10px)' : 'none' }}>
      <button className="lens-x mono" title="Close" onClick={() => {
        const v = PPVisit.load(); v.lensAsked = true; PPVisit.save(v); close();
      }}>✕</button>
      {step === 'lens' ?
        <>
          <div className="mono lens-kicker"><span className="lens-wave">◆</span>&nbsp;&nbsp;{PPGreeting().toUpperCase()} · I’M YOUR GUIDE HERE</div>
          <div className="lens-q">Hello. I can point you straight to what you need. What brings you in today?</div>
          <div className="lens-row">
            {LENSES.map((l) =>
              <button key={l.id} className="lens-btn" onClick={() => pickLens(l.id)}>{l.label}</button>
            )}
          </div>
        </>
      :
        <>
          <div className="mono lens-kicker">HAPPY TO POINT THE WAY</div>
          <div className="lens-q">What are you looking for?</div>
          <div className="lens-col">
            {PP_ROLES.map((r) =>
              <button key={r.id} className="lens-btn lens-btn-row" onClick={() => pickRole(r)}>{r.label}</button>
            )}
          </div>
        </>
      }
      <div className="mono lens-note">STAYS IN YOUR BROWSER · I LIVE IN THE ? BUTTON IF YOU NEED ME</div>
    </div>);
};

// ── Director's commentary strip ───────────────────────────────
// One quiet line, bottom-left, tied to where the visitor is and what they
// chose. Warm, human, and always selling the fit — never random.
const stripMessage = (route, v, lens) => {
  const seen = (v.cases || []).length;
  const p = route.page;
  // Role pitch — one-shot, right after the guide routes them
  if (v.pitch) {
    const r = PP_ROLES.find((x) => x.id === v.pitch);
    v.pitch = null; PPVisit.save(v);
    if (r) return { text: r.pitch, long: true };
  }
  // A small thank-you the moment a lens is chosen
  if (v.lensJustSet) {
    v.lensJustSet = false; PPVisit.save(v);
    return { text: lens === 'hiring' ? 'Wonderful. I\u2019ll keep the role fit front and centre for you' : lens === 'client' ? 'Great. I\u2019ll point out what each service can do for your project' : 'Lovely. Wander freely, I\u2019ll only chime in when it\u2019s worth it' };
  }
  // Engagement unlock — earned after three case studies
  if (seen >= 3 && !v.unlockSeen) {
    return { text: 'Three case studies in. There\u2019s more waiting in the showreel whenever you are', go: { page: 'work' }, cta: 'BACK TO MY WORK', unlock: true };
  }
  if (p === 'home') {
    if ((v.visits || 1) > 1) return { text: 'Welcome back. Shall we pick up where you left off?', go: { page: 'work' }, cta: 'MY WORK' };
    return { text: lens === 'hiring' ? 'Chances are the role you\u2019re hiring for is somewhere in My Work' : lens === 'client' ? 'Most of what a project needs lives under this one roof. My Work shows it' : 'Take your time. If you\u2019d like directions, the ? button knows the way' };
  }
  if (p === 'work') {
    if (seen >= 1) {
      const THEMES = {
        brand: ['eirsat-1', 'hytropics', 'change-of-air', 'restaurants', 'global-marketing'],
        production: ['oireachtas', 'pwc-live-av'] };
      const NAMES = {
        'eirsat-1': 'the Taoglas marketing story', 'hytropics': 'the Hytropics launch',
        'change-of-air': 'the Change of Air campaign', 'restaurants': 'the restaurant work',
        'oireachtas': 'the live broadcast work', 'pwc-live-av': 'the audio and corporate AV work' };
      const seenList = v.cases || [];
      const bCount = seenList.filter((c) => THEMES.brand.includes(c)).length;
      const pCount = seenList.filter((c) => THEMES.production.includes(c)).length;
      const theme = bCount >= pCount ? 'brand' : 'production';
      const next = THEMES[theme].find((c) => !seenList.includes(c) && NAMES[c]);
      if (next) return { text: (theme === 'brand' ? 'You have an eye for the brand side. Next, may I suggest ' : 'You\u2019re drawn to the production side. Next, may I suggest ') + NAMES[next] + '?' };
      return { text: 'And that\u2019s the whole range. Easier to show than to explain' };
    }
    return { text: lens === 'hiring' ? 'Each card is a role I\u2019ve owned end to end. Open whichever fits your brief' : 'Real projects, honestly told. Start anywhere you like' };
  }
  if (p === 'case') {
    if (route.id === 'oireachtas') return { text: 'Live national television, where every take is the take' };
    if (route.id === 'pwc-live-av') return { text: 'The rooms where the sound has to work the first time' };
    if (route.id === 'restaurants') return { text: 'Proof that a modest budget and a good eye can fill a dining room' };
    return { text: 'Every case here ends with what it changed, not just what was made' };
  }
  if (p === 'services') return { text: lens === 'client' ? 'These pair well together. Most projects use three or four at once' : 'The full toolkit, itemised. This is what full-stack means in practice' };
  if (p === 'ai') return { text: 'The playbook below is yours to borrow. The direction is the hard part' };
  return null;
};

  <script type="text/babel">
// Shared components — logo, nav, footer, primitives

// ─────────────────────────────────────────────────────────────────────────
// PP_EDITABLE — the whole site is editable ONLY by the owner, inside this
// authoring environment (where window.omelette.writeFile exists). Once the
// site is exported/published as static HTML, omelette is absent, so every
// editing affordance (image/video drops, link paste boxes, the card editor,
// the media-wall controls) is hidden and the public version is read-only.
// image-slot.js already gates on the same signal; this mirrors it for the
// React components. There is NO URL override — public builds are fully
// locked and read-only.
// PPAsset — resolves a local asset path to an embedded data URI in the baked
// static build (window.__PP_EMBED__.assets), else returns the path unchanged.
// The authoring env has no embed, so paths pass through and load normally.
if (!window.PPAsset) {
  window.PPAsset = function (p) {
    var a = window.__PP_EMBED__ && window.__PP_EMBED__.assets;
    return (a && a[p]) || p;
  };
}

window.PP_EDITABLE = !!(window.omelette && window.omelette.writeFile) &&
  !(window.__PP_EMBED__ && window.__PP_EMBED__.readonly);

// ─────────────────────────────────────────────────────────────────────────
// PPStore — durable app-state. Mirrors small JSON edits (case-study cards,
// AI layout, video links, hero link) to a project sidecar file (.app-state.json)
// so they persist across reloads, survive a cleared cache, and travel with
// share links / exports — the same durability images already have.
// localStorage stays the fast synchronous cache; the sidecar is the portable
// source of truth. hydrate() runs once before the app renders.
// ─────────────────────────────────────────────────────────────────────────
const PPStore = (function () {
  const FILE = '.app.state.json';
  const managed = new Set();
  let timer = null;

  function persist(key) {
    if (key) managed.add(key);
    clearTimeout(timer);
    timer = setTimeout(flush, 350);
  }
  function flush() {
    const w = window.omelette && window.omelette.writeFile;
    if (!w || (window.__PP_EMBED__ && window.__PP_EMBED__.readonly)) return;
    const blob = {};
    managed.forEach((k) => { const v = localStorage.getItem(k); if (v != null) blob[k] = v; });
    try { Promise.resolve(w(FILE, JSON.stringify(blob))).catch(() => {}); } catch (e) {}
  }
  async function hydrate() {
    // Baked static build: a generated bootstrap embeds the durable state
    // directly (window.__PP_EMBED__.state) so the published file needs no fetch.
    const readonly = !!(window.__PP_EMBED__ && window.__PP_EMBED__.readonly);
    try {
      const emb = window.__PP_EMBED__ && window.__PP_EMBED__.state;
      if (emb) {
        for (const k in emb) {
          managed.add(k);
          // In a PUBLIC build the baked state is authoritative: a visitor who
          // saw an older publish would otherwise keep its stale localStorage
          // copy forever (e.g. an outdated video link on their phone).
          // In the editor we must NOT clobber the owner's unsaved edits.
          if (readonly || localStorage.getItem(k) == null) {
            try { localStorage.setItem(k, emb[k]); } catch (e) {}
          }
        }
      }
    } catch (e) {}
    if (readonly) return; // published file has no sidecar to fetch
    try {
      const r = await fetch(FILE + '?ts=' + Date.now());
      if (!r.ok) return;
      const blob = await r.json();
      if (blob && typeof blob === 'object') {
        for (const k in blob) {
          managed.add(k);
          // Sidecar is the source of truth: seed localStorage when this
          // browser doesn't already have the key (fresh device / cleared cache).
          if (localStorage.getItem(k) == null) {
            try { localStorage.setItem(k, blob[k]); } catch (e) {}
          }
        }
      }
    } catch (e) {}
  }
  return { persist, flush, hydrate };
})();
window.PPStore = PPStore;

// ────────────────────────────────────────────────────────
let __wfUid = 0;
const Waveform = ({ height = 80, lines = 9, opacity = 1, speed = 16, amplitude = 1 }) => {
  const idRef = React.useRef(null);
  if (idRef.current === null) idRef.current = 'wf' + ++__wfUid;
  const id = idRef.current;
  const W = 1200,H = 200;
  const mid = H / 2;
  const paths = [];
  for (let i = 0; i < lines; i++) {
    const amp = (12 + i * (54 / lines)) * amplitude;
    const phase = i * 0.45;
    let dStr = `M 0 ${mid}`;
    for (let x = 0; x <= W; x += 12) {
      const t = x / W * Math.PI * 4 + phase;
      const env = Math.sin(x / W * Math.PI);
      const y = mid + Math.sin(t) * amp * env;
      dStr += ` L ${x} ${y.toFixed(1)}`;
    }
    paths.push(dStr);

  return (
    <div style={{ width: '100%', height, overflow: 'hidden', opacity, pointerEvents: 'none' }}>

            </defs>
            {paths.map((dStr, i) =>
          <path key={i} d={dStr} fill="none"
          stroke={`url(#wfg-${id}-${k})`}
          strokeWidth="1"
          opacity={0.25 + i / paths.length * 0.75} />
          )}
          </svg>
        )}
      </div>
      <style>{`
        .wf-track-${id} { animation: wave-drift-${id} ${speed}s linear infinite; }

// glass-player.jsx — the ONE unified video player for the whole site.
// Frosted-glass UI, auto aspect-ratio, minimal controls (play / scrub / mute /
// fullscreen). Three visual variants switched globally via body[data-player]:
//   frost  — floating glass pill bar (default)
//   ghost  — hairline progress + tiny round buttons, near-invisible
//   studio — full-width bottom gradient bar with time readout
// Engines: native <video> for files, YouTube IFrame API and Vimeo SDK for
// links — with the providers' native chrome hidden; all controls are ours.

// ── SDK loaders ────────────────────────────────────────────────────────────
function gpEnsureApi(kind, cb) {
  const ok = () => kind === 'yt' ? !!(window.YT && window.YT.Player) : !!(window.Vimeo && window.Vimeo.Player);
  if (ok()) { cb(); return () => {}; }
  const sid = kind === 'yt' ? 'pp-yt-api' : 'pp-vimeo-api';
  if (!document.getElementById(sid)) {
    const s = document.createElement('script');
    s.id = sid;
    s.src = kind === 'yt' ? 'https://www.youtube.com/iframe_api' : 'https://player.vimeo.com/api/player.js';
    document.head.appendChild(s);
  }
  const t = setInterval(() => { if (ok()) { clearInterval(t); cb(); } }, 200);
  return () => clearInterval(t);
}

// ── Aspect-ratio + thumbnail detection (oEmbed, CORS-friendly) ─────────────
const gpRatioCache = {};
function gpDetectMeta(meta, cb) {
  if (!meta || meta.provider === 'file') return;
  const key = meta.provider + ':' + meta.id;
  if (gpRatioCache[key]) { cb(gpRatioCache[key]); return; }
  // Drive has no oEmbed, but its thumbnail endpoint returns a full-size still —
  // measure it to recover the video's true aspect ratio (portrait films were
  // being forced into a 16:9 box) and reuse it as the poster.
  if (meta.provider === 'drive') {
    const u = `https://drive.google.com/thumbnail?id=${meta.id}&sz=w1920`;
    const im = new Image();
    im.onload = () => {
      const out = { w: im.naturalWidth || 0, h: im.naturalHeight || 0, thumb: u, title: null };
      gpRatioCache[key] = out;
      cb(out);
    };
    im.onerror = () => cb({ w: 0, h: 0, thumb: u, title: null });
    im.src = u;
    return;
  }
  const watch = meta.provider === 'youtube'
    ? `https://www.youtube.com/watch?v=${meta.id}`
    : `https://vimeo.com/${meta.id}`;
  const handle = (j) => {
    if (j && j.width && j.height) {
      let thumb = j.thumbnail_url || null;
      // Upgrade Vimeo thumbs to 1920w — oEmbed defaults to a tiny ~295px image
      if (thumb && meta.provider === 'vimeo') thumb = thumb.replace(/_\d+(x\d+)?(?=(\.\w+)?$)/, '_1920');
      const out = { w: j.width, h: j.height, thumb, title: j.title || null };
      gpRatioCache[key] = out;
      cb(out);
      return true;
    }
    return false;
  };
  const tryNoembed = () =>
    fetch('https://noembed.com/embed?url=' + encodeURIComponent(watch))
      .then((r) => r.json()).then((j) => { if (!handle(j)) throw 0; });
  const tryVimeo = () =>
    fetch('https://vimeo.com/api/oembed.json?url=' + encodeURIComponent(watch) + '&width=1920')
      .then((r) => r.json()).then(handle);
  // Vimeo: ask Vimeo itself first (returns a full-size 1920 thumbnail);
  // noembed is the fallback. YouTube: noembed only (poster comes from ytimg).
  if (meta.provider === 'vimeo') tryVimeo().catch(() => tryNoembed().catch(() => {}));
  else tryNoembed().catch(() => {});
}

function gpFmt(t) {
  if (!isFinite(t) || t < 0) t = 0;
  const m = Math.floor(t / 60), s = Math.floor(t % 60);

    }
    gpDetectMeta(meta, (m) => {
      if (provider !== 'youtube' && m.thumb) setThumb(m.thumb);
      if (m.w && m.h) {
        setNatAR(m.w / m.h);
        if (onRatio) onRatio(m.w, m.h);
      }
    });
  }, [provider, meta && meta.id]);

  // ── engine setup ──
  React.useEffect(() => {
    if (!meta) return;
    let dead = false;
    let cleanup = () => {};
    setReady(false); setPlaying(false); setStarted(false); setEnded(false); setCur(0); setDur(0);

    if (isNative) {
      const v = mediaRef.current;
      if (!v) return;
      v.muted = muted;
      v.loop = effLoop;
      v.playsInline = true;
      const onMeta = () => {
        setDur(v.duration || 0);
        setReady(true);
        if (v.videoWidth && v.videoHeight) {
          setNatAR(v.videoWidth / v.videoHeight);
          if (onRatio) onRatio(v.videoWidth, v.videoHeight);
        }
        if (effAutoplay) {
          v.muted = muted;
          v.play().catch(() => { v.muted = true; setMuted(true); v.play().catch(() => {}); });
        }
      };
      const onTime = () => { if (!seekingRef.current) setCur(v.currentTime); };
      const onPlay = () => { setPlaying(true); setStarted(true); setEnded(false); };
      const onPause = () => setPlaying(false);
      const onEnd = () => { setEnded(true); setPlaying(false); if (onEnded) onEnded(); };
      const onErr = () => {};
      v.addEventListener('error', onErr);
      v.addEventListener('loadedmetadata', onMeta);
      v.addEventListener('timeupdate', onTime);
      v.addEventListener('play', onPlay);
      v.addEventListener('pause', onPause);
      v.addEventListener('ended', onEnd);
      if (v.readyState >= 1) onMeta();
      ctrlRef.current = {
        play: () => v.play().catch(() => {}),
        pause: () => v.pause(),
        seek: (t) => { v.currentTime = t; setCur(t); },
        setMuted: (b) => { v.muted = b; },
      };
      cleanup = () => {
        v.removeEventListener('error', onErr);
        v.removeEventListener('loadedmetadata', onMeta);
        v.removeEventListener('timeupdate', onTime);
        v.removeEventListener('play', onPlay);
        v.removeEventListener('pause', onPause);
        v.removeEventListener('ended', onEnd);
      };
    }

    else if (provider === 'youtube') {
      let player = null, poll = null;
      const stop = gpEnsureApi('yt', () => {
        if (dead || !mediaRef.current) return;
        const mount = document.createElement('div');
        mount.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;';
        mediaRef.current.appendChild(mount);
        player = new window.YT.Player(mount, {
          videoId: meta.id,
          playerVars: {
            controls: 0, rel: 0, playsinline: 1, iv_load_policy: 3, disablekb: 1, fs: 0,
            modestbranding: 1, cc_load_policy: 0,
            autoplay: effAutoplay ? 1 : 0,
            mute: muted ? 1 : 0,
            loop: effLoop ? 1 : 0,
            ...(effLoop ? { playlist: meta.id } : {}),
          },
          events: {
            onReady: (e) => {
              if (dead) return;
              setReady(true);
              setDur(e.target.getDuration() || 0);
            },
            onStateChange: (e) => {
              if (dead) return;
              const S = window.YT.PlayerState;
              if (e.data === S.PLAYING) {
                setPlaying(true); setStarted(true); setEnded(false);
                setDur(e.target.getDuration() || 0);
              }
              if (e.data === S.PAUSED) setPlaying(false);
              if (e.data === S.ENDED) { setEnded(true); setPlaying(false); if (onEnded) onEnded(); }
            },
          },
        });
        poll = setInterval(() => {
          try {
            if (player && player.getCurrentTime && !seekingRef.current) setCur(player.getCurrentTime());
          } catch (e) {}
        }, 250);
        ctrlRef.current = {
          play: () => { try { player.playVideo(); } catch (e) {} },
          pause: () => { try { player.pauseVideo(); } catch (e) {} },
          seek: (t) => { try { player.seekTo(t, true); setCur(t); } catch (e) {} },
          setMuted: (b) => { try { b ? player.mute() : player.unMute(); } catch (e) {} },
        };
      });
      cleanup = () => {
        stop();
        if (poll) clearInterval(poll);
        try { player && player.destroy && player.destroy(); } catch (e) {}
      };
    }

    else if (provider === 'vimeo') {
      let player = null;
      const stop = gpEnsureApi('vimeo', () => {
        if (dead || !mediaRef.current) return;
        const f = document.createElement('iframe');
        // background=1 hides ALL native chrome on every account tier; the SDK
        // still gives full transport control, so the glass UI drives playback.
        f.src = `https://player.vimeo.com/video/${meta.id}?background=1&quality=1080p&app_id=58479`;
        f.allow = 'autoplay; fullscreen; picture-in-picture';
        f.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border:0;';
        f.setAttribute('title', label || 'video');
        mediaRef.current.appendChild(f);
        player = new window.Vimeo.Player(f);
        player.ready().then(() => {
          if (dead) return;
          player.setLoop(effLoop);
          player.setMuted(muted);
          if (!effAutoplay) { player.pause().catch(() => {}); player.setCurrentTime(0).catch(() => {}); }
          player.getDuration().then((d) => { if (!dead) { setDur(d || 0); setReady(true); } })
            .catch(() => { if (!dead) setReady(true); });
        }).catch(() => {});
        player.on('timeupdate', (d) => {
          if (dead || seekingRef.current) return;
          setCur(d.seconds); if (d.duration) setDur(d.duration);
        });
        player.on('play', () => { if (!dead) { setPlaying(true); setStarted(true); setEnded(false); } });
        player.on('pause', () => { if (!dead) setPlaying(false); });
        player.on('ended', () => { if (!dead) { setEnded(true); setPlaying(false); if (onEnded) onEnded(); } });
        ctrlRef.current = {
          play: () => player.play().catch(() => {}),
          pause: () => player.pause().catch(() => {}),
          seek: (t) => { player.setCurrentTime(t).catch(() => {}); setCur(t); },
          setMuted: (b) => player.setMuted(b).catch(() => {}),
        };
      });
      cleanup = () => { stop(); try { player && player.destroy(); } catch (e) {} };
    }

    return () => { dead = true; cleanup(); ctrlRef.current = null; };
  }, [provider, meta && meta.id, effLoop, effAutoplay]);

  // ── controls auto-hide ──
  const poke = () => {
    setUi(true);
    clearTimeout(hideTimer.current);
    // Touch users need longer: there is no hover to bring the bar back, so a
    // short timeout made the controls vanish mid-reach.
    const touch = typeof window !== 'undefined' &&
      window.matchMedia && window.matchMedia('(hover: none)').matches;
    hideTimer.current = setTimeout(() => setUi(false), touch ? 4800 : 2600);
  };
  React.useEffect(() => () => clearTimeout(hideTimer.current), []);
  const showUi = ui || !playing || seekingRef.current;

  // ── fullscreen on the WRAPPER so the glass bar survives fullscreen ──
  React.useEffect(() => {
    const onFs = () => setFs(!!document.fullscreenElement && document.fullscreenElement === wrapRef.current);
    document.addEventListener('fullscreenchange', onFs);
    document.addEventListener('webkitfullscreenchange', onFs);
    return () => {
      document.removeEventListener('fullscreenchange', onFs);
      document.removeEventListener('webkitfullscreenchange', onFs);
    };
  }, []);
  // Faux-fullscreen: iOS Safari refuses element fullscreen on anything but a
  // bare <video>, so iframes (YouTube/Vimeo) never expand. We fall back to a
  // fixed-position overlay, which behaves identically on every device and keeps
  // the glass bar working.
  const [fauxFs, setFauxFs] = React.useState(false);
  React.useEffect(() => {
    if (!fauxFs) return;
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    const onKey = (e) => { if (e.key === 'Escape') setFauxFs(false); };
    window.addEventListener('keydown', onKey);
    return () => { document.body.style.overflow = prev; window.removeEventListener('keydown', onKey); };
  }, [fauxFs]);

  const toggleFs = () => {
    const el = wrapRef.current;
    if (!el) return;
    if (fauxFs) { setFauxFs(false); return; }
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen || (() => {})).call(document);
      return;
    }
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) {
      try {
        const p = req.call(el);
        // Chrome/Safari reject the promise when fullscreen is unavailable
        // (common on iOS) — fall back rather than doing nothing.
        if (p && p.catch) p.catch(() => setFauxFs(true));
        // Some iOS builds resolve but never actually enter fullscreen.
        setTimeout(() => {
          if (!document.fullscreenElement && !document.webkitFullscreenElement) setFauxFs(true);
        }, 300);
      } catch (e) { setFauxFs(true); }
    } else if (mediaRef.current && mediaRef.current.webkitEnterFullscreen) {
      // iPhone Safari native video fullscreen
      try { mediaRef.current.webkitEnterFullscreen(); } catch (e) { setFauxFs(true); }
    } else {
      setFauxFs(true);
    }
  };

  // On touch devices the control bar is hidden until the viewer taps. That
  // first tap must ONLY reveal the controls — previously it also toggled
  // playback, so reaching for fullscreen appeared to pause the video by itself.
  const hitTap = (e) => {
    const touch = typeof window !== 'undefined' &&
      window.matchMedia && window.matchMedia('(hover: none)').matches;
    if (touch && !showUi) { poke(); return; }
    togglePlay(e);
  };
  const togglePlay = () => {
    const c = ctrlRef.current;
    if (!c) return;
    if (ended) { c.seek(0); c.play(); setEnded(false); }
    else if (playing) c.pause();
    else c.play();
    poke();
  };
  const toggleMute = () => {
    const c = ctrlRef.current;
    const next = !muted;
    setMuted(next);
    if (c) c.setMuted(next);
    poke();
  };

  // ── scrubbing (pointer events on the rail) ──
  const railRef = React.useRef(null);
  const seekFromEvent = (e) => {
    const rail = railRef.current;
    if (!rail || !dur) return;
    const r = rail.getBoundingClientRect();
    const x = (e.clientX != null ? e.clientX : (e.touches && e.touches[0].clientX)) - r.left;
    const p = Math.max(0, Math.min(1, x / r.width));
    const t = p * dur;
    setCur(t);
    return t;
  };
  const onRailDown = (e) => {
    e.preventDefault();
    seekingRef.current = true;
    setUi(true);
    seekFromEvent(e);
    const move = (ev) => seekFromEvent(ev);
    const up = (ev) => {
      const t = seekFromEvent(ev);
      seekingRef.current = false;
      if (ctrlRef.current && t != null) ctrlRef.current.seek(t);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      poke();
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  // ── keyboard ──
  const onKey = (e) => {
    if (locked) return;
    const c = ctrlRef.current;
    if (e.key === ' ' || e.key === 'k') { e.preventDefault(); togglePlay(); }
    else if (e.key === 'm') toggleMute();
    else if (e.key === 'f') toggleFs();
    else if (e.key === 'ArrowRight' && c && dur) c.seek(Math.min(dur, cur + 5));
    else if (e.key === 'ArrowLeft' && c && dur) c.seek(Math.max(0, cur - 5));
  };

  if (!meta) return null;
  const pct = dur ? Math.max(0, Math.min(100, (cur / dur) * 100)) : 0;
  const showPoster = !started && !effAutoplay;

  return (
    <div
      ref={wrapRef}
      className={'gp' + (locked ? ' gp-locked' : '') + (showUi && !locked ? ' gp-ui' : '') + (fs ? ' gp-fs' : '') + (fauxFs ? ' gp-faux-fs' : '')}
      tabIndex={locked ? -1 : 0}
      role="group"
      aria-label={label || 'Video player'}
      onKeyDown={onKey}
      onPointerMove={locked ? undefined : poke}
      onPointerLeave={locked ? undefined : () => { if (playing) setUi(false); }}
      style={{ position: 'absolute', inset: 0, outline: 'none', overflow: 'hidden', background: '#000',
        ...(natAR ? { '--gp-ar': String(natAR) } : null) }}
    >
      {/* media */}
      {isNative
        ? <video ref={mediaRef} src={meta && (window.PPAsset ? window.PPAsset(meta.id) : meta.id)}
            className="gp-media" preload="metadata" playsInline
            controlsList="nodownload noremoteplayback" disablePictureInPicture={false}
            onContextMenu={(e) => e.preventDefault()} />
        : provider === 'drive'
        ? <div ref={mediaRef} className="gp-media gp-embed" style={{ background: '#000' }}>
            <iframe src={`https://drive.google.com/file/d/${meta.id}/preview`}
              title={label || 'video'} allow="autoplay; fullscreen; picture-in-picture"
              allowFullScreen referrerPolicy="strict-origin-when-cross-origin"
              onLoad={(e) => { e.currentTarget.style.opacity = 1; }}
              style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', border: 0, opacity: 0, transition: 'opacity .45s ease', display: 'block' }} />
          </div>
        : <div ref={mediaRef} className="gp-media gp-embed" />
      }

      {/* poster (provider thumbnail) until first play */}
      {thumb &&
        <div className="gp-poster" aria-hidden="true" style={{
          backgroundImage: `url(${thumb})`,
          opacity: showPoster ? 1 : 0,
          pointerEvents: 'none',
        }} />
      }

      {/* click-to-toggle capture layer (also blocks provider UI). Drive owns its
          own controls, so we must not cover them. */}
      {!locked && provider !== 'drive' &&
        <div className="gp-hit" onClick={hitTap} onDoubleClick={toggleFs} />
      }

      {/* YouTube shows its own uncloseable overlays (title bar, "more videos"
          shelf) when paused — veil them with an intentional frosted-glass
          pause state so visitors never see provider chrome. */}
      {provider === 'youtube' && started && !playing &&
        <div className="gp-veil" aria-hidden="true" />
      }
      {/* …and a brief top fade at playback start to cover the title flash */}
      {provider === 'youtube' && playing && <div className="gp-tcover" aria-hidden="true" />}

      {/* center glass play / replay */}
      {!locked && (!playing || ended) &&
        <button className="gp-big" onClick={togglePlay} aria-label={ended ? 'Replay' : 'Play'}>
          <span className="gp-big-disc">{ended ? GPIcon.replay(22) : GPIcon.play(22)}</span>
        </button>
      }

      {/* loading shimmer */}
      {!ready && <div className="gp-loading" aria-hidden="true"><span /></div>}

      {/* glass control bar — hidden for Drive, whose embed exposes no API, so
          visitors never see controls that can't drive playback. */}
      {!locked && provider !== 'drive' &&
        <div className="gp-bar" onClick={(e) => { e.stopPropagation(); poke(); }}>
          <button className="gp-btn" onClick={togglePlay} aria-label={playing ? 'Pause' : 'Play'}>
            {ended ? GPIcon.replay() : playing ? GPIcon.pause() : GPIcon.play()}
          </button>
          <div className="gp-rail" ref={railRef} onPointerDown={onRailDown}
            role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax={Math.round(dur)} aria-valuenow={Math.round(cur)}>
            <div className="gp-rail-track" />
            <div className="gp-rail-fill" style={{ width: pct + '%' }} />
            <div className="gp-rail-dot" style={{ left: pct + '%' }} />
          </div>
          <span className="gp-time mono">{gpFmt(cur)}<em>/{gpFmt(dur)}</em></span>
          <button className="gp-btn" onClick={toggleMute} aria-label={muted ? 'Unmute' : 'Mute'}>
            {muted ? GPIcon.volOff() : GPIcon.volOn()}
          </button>
          <button className="gp-btn" onClick={toggleFs} aria-label="Fullscreen">
            {(fs || fauxFs) ? GPIcon.fsExit() : GPIcon.fs()}
          </button>
        </div>
      }

      {/* bottom legibility shade (variant-styled) */}
      <div className="gp-shade" aria-hidden="true" />
    </div>
  );
};

  <script type="text/babel">
// ────────────────────────────────────────────────────────────
// HeroCinema — signature full-screen interactive animation.
// A brand-gradient waveform is the "timeline" of everything Dacian does.
// A cinematic playhead scrubs across it, igniting each discipline node in
// turn (Strategy → Direction → Video → Audio → Design → AI). The wave bends
// toward the cursor and ripples on click. Its gradient + motion match the
// Waveform strip below, so the two read as one continuous signal.
// ────────────────────────────────────────────────────────────
const HeroCinema = ({ onActive, decorative = false }) => {
  const wrapRef = React.useRef(null);
  const canvasRef = React.useRef(null);
  const [hint, setHint] = React.useState(true);

  const NODES = React.useRef([
    { key: 'STRATEGY',  x: 0.10, glyph: 'target' },
    { key: 'DIRECTION', x: 0.26, glyph: 'frame' },
    { key: 'VIDEO',     x: 0.42, glyph: 'play' },
    { key: 'AUDIO',     x: 0.58, glyph: 'bars' },
    { key: 'DESIGN',    x: 0.74, glyph: 'design' },
    { key: 'MARKETING', x: 0.90, glyph: 'target' }
  ]).current;

  React.useEffect(() => {
    const wrap = wrapRef.current;
    const canvas = canvasRef.current;
    if (!wrap || !canvas) return;
    const ctx = canvas.getContext('2d');
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    let W = 0, H = 0, dpr = 1, mid = 0;
    const pointer = { x: 0.5, y: 0.5, tx: 0.5, ty: 0.5, infl: 0 };
    let ripples = [];
    let parts = [];
    let playFrac = 0;
    let lastNode = -1;
    let raf = 0;

    const PURPLE = '#720094', VIOLET = '#B388FF', BLUE = '#00287F', BLUEL = '#3A6BD8';

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = wrap.clientWidth; H = wrap.clientHeight; mid = H * 0.54;
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
      canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const N = Math.max(36, Math.min(80, Math.round(W / 22)));
      parts = Array.from({ length: N }, () => ({
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.12, vy: (Math.random() - 0.5) * 0.12,
        r: Math.random() * 1.6 + 0.4, tw: Math.random() * Math.PI * 2
      }));
    }
    resize();
    const ro = new ResizeObserver(resize);
    ro.observe(wrap);

    // ── pointer ──
    const setPtr = (cx, cy) => {
      const rect = wrap.getBoundingClientRect();
      pointer.tx = Math.max(0, Math.min(1, (cx - rect.left) / rect.width));
      pointer.ty = Math.max(0, Math.min(1, (cy - rect.top) / rect.height));

    const onMove = (e) => { setPtr(e.clientX, e.clientY); pointer.infl = Math.min(1, pointer.infl + 0.12); setHint(false); };
    const onLeave = () => { pointer.infl = 0; };
    const onDown = (e) => {
      setPtr(e.clientX, e.clientY);
      ripples.push({ x: pointer.tx, age: 0, power: 1 });
      if (ripples.length > 6) ripples.shift();
      setHint(false);
    };
    const onTouch = (e) => { if (e.touches[0]) { setPtr(e.touches[0].clientX, e.touches[0].clientY); pointer.infl = 1; setHint(false); } };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerdown', onDown);
    wrap.addEventListener('pointerleave', onLeave);
    window.addEventListener('touchmove', onTouch, { passive: true });
    window.addEventListener('touchstart', onTouch, { passive: true });

      let y = mid + Math.sin(xf * Math.PI * 4 + t * 1.15) * amp * env

      const d = xf - pointer.x;
      const bump = Math.exp(-(d * d) / (2 * 0.018)) * (pointer.y - 0.5) * H * 0.5 * pointer.infl;
      y += bump * env;

      ctx.translate(x, y);
      ctx.globalAlpha = a;
      ctx.strokeStyle = '#EAE2FF';
      ctx.fillStyle = '#EAE2FF';
      ctx.lineWidth = 1.4;

        ctx.beginPath(); ctx.arc(0, 0, s * 0.28, 0, 7); ctx.fill();
      } else if (kind === 'frame') {
        const c = s * 0.7;
        [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([sx,sy]) => {
          ctx.beginPath();
          ctx.moveTo(sx*c, sy*c - sy*s*0.35); ctx.lineTo(sx*c, sy*c); ctx.lineTo(sx*c - sx*s*0.35, sy*c);
          ctx.stroke();
        });
      } else if (kind === 'play') {
        ctx.beginPath(); ctx.moveTo(-s*0.4, -s*0.55); ctx.lineTo(s*0.6, 0); ctx.lineTo(-s*0.4, s*0.55); ctx.closePath(); ctx.fill();
      } else if (kind === 'bars') {
        const hs = [0.5, 0.95, 0.35, 0.75]; const bw = s * 0.26;
        hs.forEach((hh, i) => { const bx = (i - 1.5) * bw * 1.35; ctx.fillRect(bx - bw/2, -hh*s*0.7, bw, hh*s*1.4); });
      } else if (kind === 'design') {
        ctx.strokeRect(-s*0.6, -s*0.6, s*0.85, s*0.85);
        ctx.beginPath(); ctx.arc(s*0.25, s*0.25, s*0.4, 0, 7); ctx.stroke();
      } else if (kind === 'ai') {
        const pts = [[0,-s*0.7],[s*0.62,-s*0.2],[s*0.4,s*0.6],[-s*0.4,s*0.6],[-s*0.62,-s*0.2]];
        ctx.beginPath();
        pts.forEach((p, i) => { i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); });
        ctx.closePath(); ctx.stroke();
        pts.forEach(p => { ctx.beginPath(); ctx.arc(p[0], p[1], 1.6, 0, 7); ctx.fill(); });

      }

    }

    function frame(now) {
      const t = (now - t0) / 1000;
      pointer.x += (pointer.tx - pointer.x) * 0.07;
      pointer.y += (pointer.ty - pointer.y) * 0.07;
      if (pointer.infl > 0) pointer.infl = Math.max(0, pointer.infl - 0.004);

      ctx.clearRect(0, 0, W, H);

        if (p.x < 0) p.x += W; if (p.x > W) p.x -= W;
        if (p.y < 0) p.y += H; if (p.y > H) p.y -= H;

        }

      // ── 2. waveform band (brand spine) ──
      const grad = ctx.createLinearGradient(0, 0, W, 0);
      grad.addColorStop(0, PURPLE); grad.addColorStop(0.5, VIOLET); grad.addColorStop(1, BLUE);

      for (let li = LINES - 1; li >= 0; li--) {
        const amp = (14 + li * 13) * (reduce ? 0.7 : 1);
        const tt = reduce ? 0 : t + li * 0.18;
        ctx.beginPath();
        for (let px = 0; px <= W; px += 7) {
          const y = waveY(px / W, tt, amp);
          px ? ctx.lineTo(px, y) : ctx.moveTo(px, y);
        }
        ctx.strokeStyle = grad;
        ctx.globalAlpha = 0.22 + (li / LINES) * 0.7;
        ctx.lineWidth = li === 0 ? 2.1 : 1;
        ctx.shadowColor = 'rgba(122,44,255,0.5)';
        ctx.shadowBlur = li === 0 ? 14 : 0;
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
      ctx.globalAlpha = 1;

      // ── 3. playhead + node ignition ──
      if (!reduce) playFrac += 0.0018;
      if (playFrac > 1) { playFrac = 0; lastNode = -1; }
      const phx = playFrac * W;

      // crossing detection
      NODES.forEach((n, i) => {
        if (lastNode < i && playFrac >= n.x) {
          n._energy = 1; lastNode = i;
          if (onActive) onActive(i);
        }
      });

      // playhead line
      const pg = ctx.createLinearGradient(0, 0, 0, H);
      pg.addColorStop(0, 'rgba(234,226,255,0)');
      pg.addColorStop(0.5, 'rgba(234,226,255,0.5)');
      pg.addColorStop(1, 'rgba(234,226,255,0)');
      ctx.strokeStyle = pg; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(phx, 0); ctx.lineTo(phx, H); ctx.stroke();
      // rider dot on the wave
      const ry = waveY(playFrac, t, 14 + (LINES - 1) * 13);
      ctx.beginPath(); ctx.arc(phx, ry, 4.5, 0, 7);
      ctx.fillStyle = '#EAE2FF'; ctx.shadowColor = '#B388FF'; ctx.shadowBlur = 18; ctx.fill(); ctx.shadowBlur = 0;

      // ── 4. nodes ──
      NODES.forEach((n) => {
        const nx = n.x * W;
        const ny = waveY(n.x, t, 14 + (LINES - 1) * 13);
        const dxp = n.x - pointer.x;
        const hover = Math.exp(-(dxp * dxp) / (2 * 0.004)) * pointer.infl;
        n._energy = (n._energy || 0) * 0.94;
        const e = Math.max(n._energy, hover * 0.8);
        const baseR = 13 + e * 10;
        // ring
        ctx.beginPath(); ctx.arc(nx, ny, baseR, 0, 7);
        ctx.strokeStyle = `rgba(179,136,255,${0.35 + e * 0.6})`;
        ctx.lineWidth = 1.4 + e; ctx.stroke();
        // fill core
        ctx.beginPath(); ctx.arc(nx, ny, baseR, 0, 7);
        ctx.fillStyle = `rgba(20,8,40,${0.55 + e * 0.35})`; ctx.fill();
        // burst
        if (e > 0.05) {
          ctx.beginPath(); ctx.arc(nx, ny, baseR + (1 - e) * 34, 0, 7);
          ctx.strokeStyle = `rgba(122,44,255,${e * 0.4})`; ctx.lineWidth = 1; ctx.stroke();
        }
        drawGlyph(nx, ny, n.glyph, baseR * 0.7, 0.55 + e * 0.45);
      });

      // age ripples
      ripples.forEach(r => r.age += 0.016);
      ripples = ripples.filter(r => r.age < 3);

      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);

    return () => {
      cancelAnimationFrame(raf);
      ro.disconnect();
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerdown', onDown);
      wrap.removeEventListener('pointerleave', onLeave);
      window.removeEventListener('touchmove', onTouch);
      window.removeEventListener('touchstart', onTouch);
    };
  }, []);

  const labels = NODES.map(n => n.key);

    <div ref={wrapRef} style={{ position: 'absolute', inset: 0, zIndex: 0, overflow: 'hidden' }}>
      <canvas ref={canvasRef} style={{ position: 'absolute', inset: 0, display: 'block' }} />

      {/* Cinematic gradient + vignette + scanlines over the canvas */}
      <div style={{
        position: 'absolute', inset: 0, pointerEvents: 'none',
        background: `
          radial-gradient(ellipse at 30% 38%, rgba(114,0,148,0.30) 0%, transparent 55%),
          radial-gradient(ellipse at 76% 64%, rgba(0,40,127,0.34) 0%, transparent 55%),
          radial-gradient(ellipse at 50% 120%, rgba(0,0,0,0.6) 0%, transparent 60%),
          linear-gradient(180deg, rgba(7,6,11,0.55) 0%, transparent 22%, transparent 60%, rgba(7,6,11,0.92) 100%)
        `

        position: 'absolute', inset: 0, pointerEvents: 'none',
        backgroundImage: 'repeating-linear-gradient(180deg, transparent 0, transparent 3px, rgba(255,255,255,0.014) 3px, rgba(255,255,255,0.014) 4px)'
      }} />

      {/* interaction hint */}
      {!decorative &&
      <div className="mono" style={{
        position: 'absolute', top: 'clamp(92px, 13vh, 150px)', left: '50%', transform: 'translateX(-50%)',
        fontSize: 10, letterSpacing: '0.22em', color: 'rgba(234,226,255,0.55)',
        opacity: hint ? 1 : 0, transition: 'opacity .6s ease', pointerEvents: 'none', zIndex: 2,
        display: 'flex', alignItems: 'center', gap: 8, whiteSpace: 'nowrap'
      }}>
        <span style={{ width: 5, height: 5, borderRadius: '50%', background: '#B388FF', boxShadow: '0 0 8px #B388FF' }} />
        MOVE TO BEND THE SIGNAL · CLICK TO PLUCK
      </div>
      }

  );
};
