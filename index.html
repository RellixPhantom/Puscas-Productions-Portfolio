// URL parsing — Vimeo + YouTube + Google Drive → {provider, id}
// ────────────────────────────────────────────────────────────
// Returns { provider: 'youtube'|'vimeo'|'drive', id } or null.
// Also recognises already-built embed URLs so saved values re-parse cleanly.
function parseVideoMeta(raw) {
  if (!raw) return null;
  let s = String(raw).trim();
  if (!/^https?:\/\//i.test(s)) {
    if (/^(www\.|m\.)?(youtube\.com|youtu\.be|vimeo\.com|player\.vimeo\.com|drive\.google\.com)/i.test(s)) s = 'https://' + s;
  }
  // Bare YouTube ID (11 chars)
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return { provider: 'youtube', id: s };
  // Direct video file — a project path (uploads/reel.mp4) or any URL ending
  // in a video extension. Played natively by GlassPlayer.
  if (/\.(mp4|webm|mov|m4v)(\?.*)?$/i.test(s)) return { provider: 'file', id: s };
  try {
    const url = new URL(s);
    const h = url.hostname.replace(/^www\./, '').replace(/^m\./, '');
    const seg = url.pathname.split('/').filter(Boolean);

    // ── Google Drive ──
    if (h === 'drive.google.com') {
      // /file/d/<id>/(view|preview)  OR  ?id=<id>  (open?id=, uc?id=)
      const di = seg.indexOf('d');
      if (di >= 0 && seg[di + 1]) return { provider: 'drive', id: seg[di + 1] };
      const qid = url.searchParams.get('id');
      if (qid) return { provider: 'drive', id: qid };
    }
    if (h === 'docs.google.com' && seg[0] === 'file') {
      const di = seg.indexOf('d');
      if (di >= 0 && seg[di + 1]) return { provider: 'drive', id: seg[di + 1] };
    }

    // ── Vimeo ──
    if (h === 'player.vimeo.com') {
      const vi = seg.indexOf('video');
      const id = vi >= 0 ? seg[vi + 1] : seg[0];
      if (/^\d+$/.test(id)) return { provider: 'vimeo', id };
    }
    if (h.endsWith('vimeo.com')) {
      const id = seg[0];
      if (/^\d+$/.test(id)) return { provider: 'vimeo', id };
    }

    // ── YouTube ──
    if (h === 'youtube.com' || h === 'youtube-nocookie.com') {
      if (['embed', 'shorts', 'live', 'v'].includes(seg[0]) && seg[1]) return { provider: 'youtube', id: seg[1] };
      const v = url.searchParams.get('v');
      if (v) return { provider: 'youtube', id: v };
    }
    if (h === 'youtu.be' && seg[0]) return { provider: 'youtube', id: seg[0] };
  } catch (e) {}
  return null;
}

// Build an embeddable iframe URL from meta + playback options.
// opts: { mute, autoplay, loop, background, jsapi, userGesture }
//   background    = chromeless hero mode
//   jsapi         = enable the provider's JS API (for 'ended' detection)
//   userGesture   = playback started by a click, so unmuted autoplay is allowed
function buildVideoEmbed(meta, opts = {}) {
  if (!meta) return null;
  const { provider, id } = meta;
  const { mute, autoplay, loop, background, jsapi, userGesture } = opts;
  // Unmuted autoplay is blocked by browsers — force mute whenever autoplaying,
  // UNLESS playback was triggered by a user gesture (then sound is allowed).
  const muted = userGesture ? !!mute : (mute || autoplay);

  if (provider === 'youtube') {
    const p = new URLSearchParams({ rel: '0', modestbranding: '1', playsinline: '1' });
    if (muted) p.set('mute', '1');
    if (autoplay) p.set('autoplay', '1');
    if (loop) { p.set('loop', '1'); p.set('playlist', id); }
    if (background) p.set('controls', '0');
    if (jsapi) { p.set('enablejsapi', '1'); }
    return `https://www.youtube.com/embed/${id}?${p.toString()}`;
  }
  if (provider === 'vimeo') {
    const p = new URLSearchParams();
    if (muted) p.set('muted', '1');
    if (autoplay) p.set('autoplay', '1');
    if (loop) p.set('loop', '1');
    if (background) p.set('background', '1');
    const q = p.toString();
    return `https://player.vimeo.com/video/${id}${q ? '?' + q : ''}`;
  }
  if (provider === 'drive') {
    // Drive's preview player ignores autoplay/mute/loop params, but still embeds.
    return `https://drive.google.com/file/d/${id}/preview`;
  }
  return null;
}

// Attach an 'ended' listener to an existing YouTube/Vimeo iframe via its JS API,
// loading the provider SDK once if needed. Returns a cleanup fn. Drive has no API.
function attachVideoEnded(iframeEl, meta, onEnded) {
  if (!iframeEl || !meta) return () => {};
  let player = null, poll = null, cancelled = false;
  if (meta.provider === 'youtube') {
    const init = () => {
      if (cancelled || !(window.YT && window.YT.Player)) return;
      try { player = new window.YT.Player(iframeEl, { events: { onStateChange: (e) => { if (e.data === 0) onEnded(); } } }); } catch (e) {}
    };
    if (window.YT && window.YT.Player) init();
    else {
      if (!document.getElementById('pp-yt-api')) {
        const s = document.createElement('script'); s.id = 'pp-yt-api'; s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
      }
      poll = setInterval(() => { if (window.YT && window.YT.Player) { clearInterval(poll); init(); } }, 250);
    }
  } else if (meta.provider === 'vimeo') {
    const init = () => {
      if (cancelled || !(window.Vimeo && window.Vimeo.Player)) return;
      try { player = new window.Vimeo.Player(iframeEl); player.on('ended', onEnded); } catch (e) {}
    };
    if (window.Vimeo && window.Vimeo.Player) init();
    else {
      if (!document.getElementById('pp-vimeo-api')) {
        const s = document.createElement('script'); s.id = 'pp-vimeo-api'; s.src = 'https://player.vimeo.com/api/player.js'; document.head.appendChild(s);
      }
      poll = setInterval(() => { if (window.Vimeo && window.Vimeo.Player) { clearInterval(poll); init(); } }, 250);
    }
  }
  return () => {
    cancelled = true;
    if (poll) clearInterval(poll);
    try { if (player && player.destroy) player.destroy(); else if (player && player.unload) player.unload(); } catch (e) {}
  };
}

// Backwards-compatible: string in → embeddable string out (default options).
function parseVideoUrl(raw) {
  return buildVideoEmbed(parseVideoMeta(raw), {});
}

function parseAudioUrl(raw) {
  try {
    const url = new URL(raw.trim());
    const h = url.hostname.replace('www.', '');
    if (h === 'open.spotify.com') {
      const parts = url.pathname.split('/').filter(Boolean); // [type, id]
      if (parts.length >= 2) return { kind: 'spotify', src: `https://open.spotify.com/embed/${parts[0]}/${parts[1]}`, h: parts[0] === 'track' ? 152 : 352 };
    }
    if (h.endsWith('soundcloud.com')) {
      return { kind: 'soundcloud', src: `https://w.soundcloud.com/player/?url=${encodeURIComponent(raw.trim())}&color=%23720094&inverse=true&auto_play=false&show_user=true`, h: 166 };
    }
  } catch (e) {}
  return null;
}

// ────────────────────────────────────────────────────────────
// IndexedDB helper (photos + mp3s)
// ────────────────────────────────────────────────────────────
function ppDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('pp-media', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('m');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function ppGet(key) {
  const db = await ppDB();
  return new Promise((res) => {
    const t = db.transaction('m').objectStore('m').get(key);
    t.onsuccess = () => res(t.result || null);
    t.onerror = () => res(null);
  });
}
async function ppSet(key, val) {
  const db = await ppDB();
  return new Promise((res) => {
    const t = db.transaction('m', 'readwrite');
    if (val === null) t.objectStore('m').delete(key);
    else t.objectStore('m').put(val, key);
    t.oncomplete = () => res();
  });
}

// ────────────────────────────────────────────────────────────
// VideoLinkSlot — paste a YouTube / Vimeo / Google Drive link, drop a video
// file on it, or reference an uploaded project file. YouTube/Vimeo/files play
// through the unified GlassPlayer (auto aspect-ratio, frosted-glass controls);
// Drive plays through Drive's own preview player, gated behind your custom
// thumbnail so it looks native to the site until clicked.
// ────────────────────────────────────────────────────────────
const VideoLinkSlot = ({ id, label, aspect = '16/9', big = false, lockPublic = false }) => {
  const KEY = `pp-video-link-${id}`;
  const FILE_KEY = `pp-video-file-${id}`;

  // Load saved value. New format = JSON {meta, opts}. Old format = plain embed
  // URL string → re-parse it back into meta so existing links keep working.
  const load = () => {
    const raw = localStorage.getItem(KEY);
    if (!raw) return { meta: null, opts: { mute: false, autoplay: false, loop: false } };
    try {
      const j = JSON.parse(raw);
      if (j && j.meta) return { meta: j.meta, opts: { mute: false, autoplay: false, loop: false, ...(j.opts || {}) } };
    } catch (e) {}
    return { meta: parseVideoMeta(raw), opts: { mute: false, autoplay: false, loop: false } };
  };

  const [{ meta, opts }, setState] = React.useState(load);
  const [draft, setDraft] = React.useState('');
  const [err, setErr] = React.useState('');
  const [hover, setHover] = React.useState(false);
  const [dragOver, setDragOver] = React.useState(false);
  const [blobUrl, setBlobUrl] = React.useState(null);
  const [playing, setPlaying] = React.useState(false);
  const fileRef = React.useRef(null);
  const ed = window.PP_EDITABLE;

  const save = (nextMeta, nextOpts) => {
    localStorage.setItem(KEY, JSON.stringify({ meta: nextMeta, opts: nextOpts }));
    if (window.PPStore) window.PPStore.persist(KEY);
    setState({ meta: nextMeta, opts: nextOpts });
  };

  // Browser-stored file (IndexedDB) → object URL for native playback.
  // If the blob isn't in this browser (e.g. the public build on another
  // device), flag it missing instead of hanging on "loading" forever.
  const [idbMissing, setIdbMissing] = React.useState(false);
  React.useEffect(() => {
    let alive = true, url = null;
    setIdbMissing(false);
    if (meta && meta.provider === 'idb') {
      ppGet(FILE_KEY).then((blob) => {
        if (!alive) return;
        if (blob) { url = URL.createObjectURL(blob); setBlobUrl(url); }
        else setIdbMissing(true);
      }).catch(() => { if (alive) setIdbMissing(true); });
    } else { setBlobUrl(null); }
    return () => { alive = false; if (url) URL.revokeObjectURL(url); };
  }, [meta && meta.provider, meta && meta.id]);

  const submit = () => {
    const m = parseVideoMeta(draft);
    if (!m) { setErr("COULDN'T READ THAT · PASTE A YOUTUBE / VIMEO / DRIVE LINK OR A VIDEO FILE PATH"); return; }
    save(m, opts); setDraft(''); setErr('');
  };
  const clear = () => {
    localStorage.removeItem(KEY);
    if (window.PPStore) window.PPStore.persist(KEY);
    ppSet(FILE_KEY, null);
    setPlaying(false);
    setState({ meta: null, opts: { mute: false, autoplay: false, loop: false } });
  };
  const toggle = (k) => save(meta, { ...opts, [k]: !opts[k] });

  const dropFile = (files) => {
    const f = [...files].find((x) => x.type.startsWith('video/') || /\.(mp4|webm|mov|m4v)$/i.test(x.name));
    if (!f) return;
    ppSet(FILE_KEY, f).then(() => save({ provider: 'idb', id }, opts));
  };

  // Locked-playback mode: public viewers get an autoplaying, muted, looping
  // background player with no controls. GlassPlayer handles it natively.
  const locked = lockPublic && !window.PP_EDITABLE;

  // ── Auto aspect-ratio ──
  // GlassPlayer detects the video's native size (oEmbed for links, metadata
  // for files) and reports it once; we persist it so the frame is right on
  // first paint — portrait shows portrait, ultrawide shows ultrawide.
  const ratio = (opts.arw && opts.arh) ? `${opts.arw}/${opts.arh}` : (opts.ar || aspect);
  const [arwN, arhN] = String(ratio).split('/').map(Number);
  const portrait = arhN > arwN;
  const onRatio = (w, h) => {
    if (!w || !h) return;
    if (opts.arw === w && opts.arh === h) return;
    if (!ed) return; // public build uses the baked ratio
    save(meta, { ...opts, arw: w, arh: h });
  };

  const isDrive = meta && meta.provider === 'drive';
  // Public build: an unfilled slot renders nothing at all — no placeholder box.
  if (!meta && !ed) return null;
  const driveUrl = isDrive ? `https://drive.google.com/file/d/${meta.id}/view` : null;
  const isIdb = meta && meta.provider === 'idb';

  // Meta handed to the player (idb blob → file URL). Drive now goes through
  // GlassPlayer too — it streams the file natively so the controls, ratio and
  // fullscreen match every other player on the site.
  const playMeta = isIdb
    ? (blobUrl ? { provider: 'file', id: blobUrl } : null)
    : meta;

  // ── Custom end-card thumbnail (optional) ──
  // A per-video poster the owner sets in edit mode. When set, the video is
  // gated behind the poster + play button, and reverts to it on end.
  const thumbId = `vthumb-${id}`;
  const slotWrapRef = React.useRef(null);
  const thumbFromEmbed = () => {
    try {
      const e = window.__PP_EMBED__ && window.__PP_EMBED__.islots && window.__PP_EMBED__.islots[thumbId];
      if (e && (typeof e === 'string' ? e : e.u)) return true;
    } catch (x) {}
    return false;
  };
  const [hasThumb, setHasThumb] = React.useState(thumbFromEmbed);
  React.useEffect(() => {
    const root = slotWrapRef.current;
    if (!root) return;
    const el = root.querySelector('image-slot');
    if (!el) return;
    const read = () => setHasThumb(el.hasAttribute('data-filled'));
    read();
    const mo = new MutationObserver(read);
    mo.observe(el, { attributes: true, attributeFilter: ['data-filled'] });
    const t = setTimeout(read, 700);
    return () => { mo.disconnect(); clearTimeout(t); };
  }, [id, hasThumb, playing]);

  // Poster-gate rule: any video with a custom thumbnail waits behind it.
  const gated = !!playMeta && !locked && hasThumb;
  const showPoster = gated && !playing;
  const showAddThumb = ed && !locked && !!playMeta && !hasThumb && !playing;

  const ctrlBtn = (active, onClick, title, children, disabled) => (
    <button onClick={onClick} title={title} disabled={disabled} style={{
      display: 'inline-flex', alignItems: 'center', gap: 5,
      padding: '6px 10px', borderRadius: 99,
      border: `1px solid ${active ? 'var(--violet)' : 'rgba(255,255,255,0.25)'}`,
      background: active ? 'var(--violet)' : 'rgba(0,0,0,0.6)',
      color: disabled ? 'rgba(255,255,255,0.35)' : '#fff',
      fontSize: 10, fontFamily: 'var(--mono)', letterSpacing: '0.08em',
      cursor: disabled ? 'not-allowed' : 'pointer',
      backdropFilter: 'blur(8px)', whiteSpace: 'nowrap'
    }}>{children}</button>
  );

  // In edit mode, a browser-upload whose file is gone is a dead end — fall
  // through to the empty slot so the link input is available again.
  const deadIdb = isIdb && idbMissing && ed;

  // Public site: an empty slot is invisible — visitors never see template
  // chrome or "paste a link" placeholders.
  if ((!meta || deadIdb) && !ed) return null;

  return (
    <div
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      onDragOver={ed ? (e) => { e.preventDefault(); setDragOver(true); } : undefined}
      onDragLeave={ed ? () => setDragOver(false) : undefined}
      onDrop={ed ? (e) => { e.preventDefault(); setDragOver(false); dropFile(e.dataTransfer.files); } : undefined}
      style={{
        position: 'relative',
        width: portrait ? (big ? 'min(100%, 420px)' : '100%') : '100%',
        margin: portrait ? '0 auto' : undefined,
        aspectRatio: ratio,
        borderRadius: 14,
        overflow: 'hidden',
        border: dragOver ? '1px dashed var(--violet)' : '1px solid var(--line)',
        boxShadow: dragOver ? '0 0 0 3px rgba(114,0,148,0.25)' : 'none',
        background: 'var(--ink-2)',
        transition: 'box-shadow .2s ease'
      }}>

      {meta && !deadIdb ?
        <>
          {/* the player (mounted unless poster-gated and idle) */}
          {playMeta && (!gated || playing) &&
            <GlassPlayer
              key={playMeta.provider + ':' + playMeta.id + (gated && playing ? ':gesture' : '')}
              meta={playMeta}
              opts={gated && playing ? { ...opts, autoplay: true, userGesture: true } : opts}
              locked={locked}
              onRatio={onRatio}
              onEnded={gated ? () => setPlaying(false) : undefined}
              ar={(opts.arw && opts.arh) ? (opts.arw / opts.arh) : null}
              label={label || 'Video'} />
          }
          {/* browser-stored file: still loading, or not on this device */}
          {isIdb && !blobUrl && !idbMissing &&
            <div className="mono" style={{
              position: 'absolute', inset: 0, display: 'grid', placeItems: 'center',
              fontSize: 10, letterSpacing: '0.14em', color: 'var(--mute)'
            }}>LOADING VIDEO…</div>
          }
          {isIdb && idbMissing && !ed &&
            <div className="mono" style={{
              position: 'absolute', inset: 0, display: 'grid', placeItems: 'center',
              padding: 24, textAlign: 'center',
              fontSize: 10, letterSpacing: '0.14em', color: 'var(--mute)', lineHeight: 1.8
            }}>{ed ? 'VIDEO FILE NOT IN THIS BROWSER · RE-DROP THE FILE, OR USE A YOUTUBE / VIMEO / DRIVE LINK' : 'VIDEO COMING SOON'}</div>
          }

          {/* end-card poster overlay */}
          {gated &&
            <div ref={slotWrapRef} style={{
              position: 'absolute', inset: 0,
              zIndex: showPoster ? 4 : -1,
              opacity: showPoster ? 1 : 0,
              pointerEvents: showPoster ? 'auto' : 'none',
              transition: 'opacity .3s ease',
              background: 'var(--ink-2)'
            }}>
              <image-slot id={thumbId} placeholder={ed ? 'Drop a thumbnail (optional)' : ''}
                shape="rect" fit="cover"
                style={{ position: 'absolute', inset: 0, width: '100%', height: '100%' }}></image-slot>
              {showPoster &&
                <button onClick={() => setPlaying(true)} aria-label="Play" style={{
                  position: 'absolute', top: '50%', left: '50%', transform: 'translate(-50%,-50%)',
                  width: 72, height: 72, borderRadius: '50%', border: '1px solid rgba(255,255,255,0.3)',
                  background: 'rgba(255,255,255,0.10)', color: '#fff', cursor: 'pointer',
                  display: 'grid', placeItems: 'center', zIndex: 3,
                  backdropFilter: 'blur(18px) saturate(160%)', WebkitBackdropFilter: 'blur(18px) saturate(160%)',
                  boxShadow: '0 18px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.25)'
                }}>
                  <svg width="20" height="22" viewBox="0 0 22 24" fill="none" style={{ marginLeft: 2 }}><path d="M20 12L1 23V1L20 12Z" fill="currentColor"/></svg>
                </button>
              }
            </div>
          }

          {/* edit-mode: small end-card adder */}
          {showAddThumb &&
            <div ref={slotWrapRef} title="Set a custom end-card thumbnail, shown before play and when the video ends"
              style={{
                position: 'absolute', bottom: 60, left: 10, zIndex: 5,
                width: 132, height: 78, borderRadius: 8, overflow: 'hidden',
                border: '1px dashed rgba(255,255,255,0.4)', boxShadow: '0 6px 20px rgba(0,0,0,0.4)',
                opacity: hover ? 1 : 0, pointerEvents: hover ? 'auto' : 'none', transition: 'opacity .2s ease'
              }}>
              <image-slot id={thumbId} placeholder="＋ END CARD" shape="rect" fit="cover"
                style={{ position: 'absolute', inset: 0, width: '100%', height: '100%' }}></image-slot>
            </div>
          }

          {/* edit-mode controls */}
          {ed && hover &&
            <>
              <div style={{
                position: 'absolute', top: 10, left: 10, zIndex: 7,
                display: 'flex', gap: 6, flexWrap: 'wrap', maxWidth: 'calc(100% - 60px)'
              }}>
                {isDrive ?
                  <a href={driveUrl} target="_blank" rel="noopener noreferrer" className="mono" style={{
                    display: 'inline-flex', alignItems: 'center', gap: 5,
                    padding: '6px 10px', borderRadius: 99,
                    border: '1px solid rgba(255,255,255,0.25)', background: 'rgba(0,0,0,0.6)',
                    color: '#fff', fontSize: 10, letterSpacing: '0.08em',
                    backdropFilter: 'blur(8px)', textDecoration: 'none', whiteSpace: 'nowrap'
                  }}>OPEN IN DRIVE ↗</a>
                :
                  <>
                    {ctrlBtn(opts.mute, () => toggle('mute'), 'Mute audio', <>{opts.mute ? '🔇' : '🔊'} MUTE</>, false)}
                    {ctrlBtn(opts.autoplay, () => toggle('autoplay'), 'Autoplay (muted by browsers)', <>▶ AUTOPLAY</>, false)}
                  </>
                }
              </div>
              <button onClick={clear} title="Remove video" style={{
                position: 'absolute', top: 10, right: 10,
                width: 28, height: 28, borderRadius: '50%',
                border: '1px solid rgba(255,255,255,0.3)',
                background: 'rgba(0,0,0,0.6)',
                color: 'white', fontSize: 13,
                display: 'grid', placeItems: 'center', zIndex: 7
              }}>✕</button>
              {isDrive && !hasThumb &&
                <div className="mono" style={{
                  position: 'absolute', bottom: 10, left: 10, zIndex: 7,
                  fontSize: 9, letterSpacing: '0.1em', color: 'rgba(255,255,255,0.75)',
                  background: 'rgba(0,0,0,0.65)', padding: '5px 9px', borderRadius: 6,
                  backdropFilter: 'blur(8px)', maxWidth: 'calc(100% - 20px)'
                }}>DRIVE FILE MUST BE SHARED "ANYONE WITH THE LINK" TO STREAM IN THE SITE PLAYER</div>
              }
              {isIdb &&
                <div className="mono" style={{
                  position: 'absolute', bottom: 10, left: 10, zIndex: 7,
                  fontSize: 9, letterSpacing: '0.1em', color: 'rgba(255,255,255,0.75)',
                  background: 'rgba(0,0,0,0.65)', padding: '5px 9px', borderRadius: 6,
                  backdropFilter: 'blur(8px)', maxWidth: 'calc(100% - 20px)'
                }}>STORED IN THIS BROWSER ONLY · WON'T PUBLISH · SEND THE FILE OR USE A LINK</div>
              }
            </>
          }
        </>

      :
        // ── Empty slot ──
        <div style={{
          position: 'absolute', inset: 0,
          display: 'flex', flexDirection: 'column',
          alignItems: 'center', justifyContent: 'center',
          gap: 12, padding: 20,
          background: dragOver
            ? 'linear-gradient(160deg, rgba(114,0,148,0.32) 0%, rgba(0,40,127,0.26) 100%)'
            : 'linear-gradient(160deg, rgba(114,0,148,0.18) 0%, rgba(0,40,127,0.14) 100%)',
          transition: 'background .2s ease'
        }}>
          <div className="mono" style={{
            fontSize: 11, letterSpacing: '0.16em',
            color: 'var(--fog)', textTransform: 'uppercase', textAlign: 'center'
          }}>{label || 'Video'}</div>
          {ed &&
            <>
              <div style={{ display: 'flex', gap: 8, width: '100%', maxWidth: big ? 480 : 320 }}>
                <input
                  value={draft}
                  onChange={(e) => { setDraft(e.target.value); setErr(''); }}
                  onKeyDown={(e) => e.key === 'Enter' && submit()}
                  placeholder="Paste a YouTube / Vimeo / Drive link"
                  style={{
                    flex: 1,
                    padding: '10px 14px',
                    borderRadius: 8,
                    border: `1px solid ${err ? '#FF5C5C' : 'var(--line-2)'}`,
                    background: 'rgba(0,0,0,0.45)',
                    color: 'var(--hi)',
                    fontSize: 13,
                    fontFamily: 'var(--sans)',
                    outline: 'none',
                    minWidth: 0
                  }} />
                <button onClick={submit} style={{
                  padding: '10px 16px',
                  borderRadius: 8,
                  background: 'var(--violet)',

// ────────────────────────────────────────────────────────────
// PhotoGrid — unlimited uploads, hover zoom, fullscreen lightbox
// ────────────────────────────────────────────────────────────
const PhotoGrid = ({ id }) => {
  const ed = window.PP_EDITABLE;
  const KEY = `pp-photos-${id}`;
  const [photos, setPhotos] = React.useState([]); // [{url}]
  const [lightbox, setLightbox] = React.useState(-1);
  const inputRef = React.useRef(null);

  React.useEffect(() => {
    let alive = true;
    ppGet(KEY).then((blobs) => {
      if (alive && Array.isArray(blobs)) {
        setPhotos(blobs.map((b) => ({ blob: b, url: URL.createObjectURL(b) })));
      }
    });
    return () => {alive = false;};
  }, []);

  const persist = (list) => ppSet(KEY, list.map((p) => p.blob));

  const addFiles = (files) => {
    const imgs = [...files].filter((f) => f.type.startsWith('image/'));
    if (!imgs.length) return;
    setPhotos((prev) => {
      const next = [...prev, ...imgs.map((b) => ({ blob: b, url: URL.createObjectURL(b) }))];
      persist(next);
      return next;
    });
  };
  const removeAt = (i) => {
    setPhotos((prev) => {
      const next = prev.filter((_, k) => k !== i);
      persist(next);
      return next;
    });
    setLightbox(-1);
  };

  // Lightbox keyboard nav
  React.useEffect(() => {
    if (lightbox < 0) return;
    const onKey = (e) => {
      if (e.key === 'Escape') setLightbox(-1);
      if (e.key === 'ArrowRight') setLightbox((i) => (i + 1) % photos.length);
      if (e.key === 'ArrowLeft') setLightbox((i) => (i - 1 + photos.length) % photos.length);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [lightbox, photos.length]);

  return (
    <div>
      <div style={{
        display: 'grid',
        gridTemplateColumns: 'repeat(auto-fill, minmax(220px, 1fr))',
        gridAutoRows: '220px',
        gap: 10
      }}>
        {photos.map((p, i) =>
        <button key={i} className="pp-photo" onClick={() => setLightbox(i)} style={{
          position: 'relative',
          borderRadius: 10,
          overflow: 'hidden',
          border: '1px solid var(--line)',
          cursor: 'zoom-in',
          padding: 0,
          background: 'var(--ink-2)',
          // big photos take double cells for rhythm
          gridColumn: i % 7 === 0 ? 'span 2' : 'span 1',
          gridRow: i % 7 === 0 ? 'span 2' : 'span 1'
        }}>
            <img src={p.url} alt={`Photo ${i + 1}`} style={{
            position: 'absolute', inset: 0,
            width: '100%', height: '100%',
            objectFit: 'cover',
            transition: 'transform .5s cubic-bezier(.22,1,.36,1)'
          }} />
          </button>
        )}
        {/* Add tile — owner only */}
        {ed &&
        <button onClick={() => inputRef.current && inputRef.current.click()} style={{
          borderRadius: 10,
          border: '1px dashed var(--line-2)',
          background: 'rgba(114,0,148,0.06)',
          color: 'var(--fog)',
          display: 'flex', flexDirection: 'column',
          alignItems: 'center', justifyContent: 'center', gap: 8,
          cursor: 'pointer',
          minHeight: 220,
          transition: 'border-color .2s ease, background .2s ease'
        }}
        onMouseEnter={(e) => {e.currentTarget.style.borderColor = 'var(--violet)';e.currentTarget.style.background = 'rgba(114,0,148,0.14)';}}
        onMouseLeave={(e) => {e.currentTarget.style.borderColor = 'var(--line-2)';e.currentTarget.style.background = 'rgba(114,0,148,0.06)';}}>
          <span style={{
            width: 40, height: 40, borderRadius: '50%',
            background: 'var(--violet)', color: 'white',
            display: 'grid', placeItems: 'center', fontSize: 20
          }}>+</span>
          <span className="mono" style={{ fontSize: 11, letterSpacing: '0.14em' }}>ADD PHOTOS</span>
        </button>
        }
      </div>
      {ed &&
      <input ref={inputRef} type="file" accept="image/*" multiple style={{ display: 'none' }}
      onChange={(e) => {addFiles(e.target.files);e.target.value = '';}} />
      }

      <style>{`
        .pp-photo:hover img { transform: scale(1.10); }
        .pp-photo::after {
          content: "";
          position: absolute; inset: 0;
          background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.35) 100%);
          opacity: 0;
          transition: opacity .3s ease;
        }
        .pp-photo:hover::after { opacity: 1; }
      `}</style>

      {/* Lightbox */}
      {lightbox >= 0 && photos[lightbox] &&
      <div onClick={() => setLightbox(-1)} style={{
        position: 'fixed', inset: 0, zIndex: 600,
        background: 'rgba(0,0,0,0.94)',
        display: 'grid', placeItems: 'center',
        animation: 'lb-in .25s ease'
      }}>
          <img src={photos[lightbox].url} alt="" onClick={(e) => e.stopPropagation()} style={{
          maxWidth: '92vw', maxHeight: '88vh',
          borderRadius: 8,
          boxShadow: '0 30px 90px rgba(0,0,0,0.6)',
          animation: 'lb-img .3s cubic-bezier(.22,1,.36,1)'
        }} />
          {/* Controls */}
          <button onClick={(e) => {e.stopPropagation();setLightbox((lightbox - 1 + photos.length) % photos.length);}} style={lbBtn({ left: 18 })}>←</button>
          <button onClick={(e) => {e.stopPropagation();setLightbox((lightbox + 1) % photos.length);}} style={lbBtn({ right: 18 })}>→</button>
          <button onClick={(e) => {e.stopPropagation();setLightbox(-1);}} style={lbBtn({ top: 18, right: 18, position: 'fixed' })}>✕</button>
          {ed &&
          <button onClick={(e) => {e.stopPropagation();removeAt(lightbox);}} className="mono" style={{
          position: 'fixed', bottom: 22, right: 22,
          padding: '8px 14px', borderRadius: 99,
          border: '1px solid rgba(255,255,255,0.25)',
          background: 'rgba(0,0,0,0.5)',
          color: 'rgba(255,255,255,0.75)',
          fontSize: 11, letterSpacing: '0.12em'
        }}>DELETE PHOTO</button>
          }
          <div className="mono" style={{
          position: 'fixed', bottom: 24, left: '50%',
          transform: 'translateX(-50%)',
          color: 'rgba(255,255,255,0.6)',
          fontSize: 12, letterSpacing: '0.14em'
        }}>{lightbox + 1} / {photos.length}</div>
          <style>{`
            @keyframes lb-in { from { opacity: 0 } to { opacity: 1 } }
            @keyframes lb-img { from { transform: scale(0.92); opacity: 0 } to { transform: scale(1); opacity: 1 } }
          `}</style>
        </div>
      }
    </div>);

};
function lbBtn(pos) {
  return {
    position: 'fixed',
    top: pos.top !== undefined ? pos.top : '50%',
    left: pos.left,
    right: pos.right,
    transform: pos.top !== undefined ? 'none' : 'translateY(-50%)',
    width: 44, height: 44,
    borderRadius: '50%',
    border: '1px solid rgba(255,255,255,0.25)',
    background: 'rgba(0,0,0,0.5)',
    color: 'white',
    fontSize: 17,
    display: 'grid', placeItems: 'center',
    cursor: 'pointer',
    zIndex: 601
  };
}

// ────────────────────────────────────────────────────────────
// AudioGallery — MP3 uploads + Spotify/SoundCloud links
// ────────────────────────────────────────────────────────────
const AudioGallery = ({ id = 'audio' }) => {
  const ed = window.PP_EDITABLE;
  const LINKS_KEY = `pp-audio-links-${id}`;
  const MP3_KEY = `pp-audio-mp3-${id}`;
  const [links, setLinks] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem(LINKS_KEY)) || []; } catch (e) { return []; }
  });
  const [tracks, setTracks] = React.useState([]); // [{name, url, blob}]
  const [draft, setDraft] = React.useState('');
  const [err, setErr] = React.useState(false);
  const fileRef = React.useRef(null);

  React.useEffect(() => {
    let alive = true;
    ppGet(MP3_KEY).then((items) => {
      if (alive && Array.isArray(items)) {
        setTracks(items.map((it) => ({ name: it.name, blob: it.blob, url: URL.createObjectURL(it.blob) })));
      }
    });
    return () => {alive = false;};
  }, []);

  const persistTracks = (list) => ppSet(MP3_KEY, list.map((t) => ({ name: t.name, blob: t.blob })));

  const addLink = () => {
    const parsed = parseAudioUrl(draft);
    if (!parsed) { setErr(true); return; }
    const next = [...links, parsed];
    setLinks(next);
    localStorage.setItem(LINKS_KEY, JSON.stringify(next));
    if (window.PPStore) window.PPStore.persist(LINKS_KEY);
    setDraft('');
    setErr(false);
  };
  const removeLink = (i) => {
    const next = links.filter((_, k) => k !== i);
    setLinks(next);
    localStorage.setItem(LINKS_KEY, JSON.stringify(next));
    if (window.PPStore) window.PPStore.persist(LINKS_KEY);
  };
  const addFiles = (files) => {
    const mp3s = [...files].filter((f) => f.type.startsWith('audio/'));
    if (!mp3s.length) return;
    setTracks((prev) => {
      const next = [...prev, ...mp3s.map((b) => ({ name: b.name.replace(/\.[^.]+$/, ''), blob: b, url: URL.createObjectURL(b) }))];
      persistTracks(next);
      return next;
    });
  };
  const removeTrack = (i) => {
    setTracks((prev) => {
      const next = prev.filter((_, k) => k !== i);
      persistTracks(next);
      return next;
    });
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 28 }}>
      {/* Add bar — owner only */}
      {ed &&
      <div className="reveal" style={{
        display: 'flex', gap: 10, flexWrap: 'wrap', alignItems: 'center',
        padding: 18,
        border: '1px solid var(--line)',
        borderRadius: 12,
        background: 'rgba(114,0,148,0.05)'
      }}>
        <button onClick={() => fileRef.current && fileRef.current.click()} style={{
          padding: '11px 18px',
          borderRadius: 99,
          background: 'var(--violet)',
          color: 'white',
          fontSize: 13,
          fontWeight: 500,
          whiteSpace: 'nowrap'
        }}>+ Add MP3s</button>
        <span className="mono" style={{ fontSize: 11, color: 'var(--mute)', letterSpacing: '0.1em' }}>OR</span>
        <input
          value={draft}
          onChange={(e) => {setDraft(e.target.value);setErr(false);}}
          onKeyDown={(e) => e.key === 'Enter' && addLink()}
          placeholder="Paste a Spotify or SoundCloud link"
          style={{
            flex: 1,
            minWidth: 220,
            padding: '11px 14px',
            borderRadius: 8,
            border: `1px solid ${err ? '#FF5C5C' : 'var(--line-2)'}`,
            background: 'rgba(0,0,0,0.45)',
            color: 'var(--hi)',
            fontSize: 13,
            fontFamily: 'var(--sans)',
            outline: 'none'
          }} />
        <button onClick={addLink} style={{
          padding: '11px 18px',
          borderRadius: 8,
          background: 'transparent',
          border: '1px solid var(--line-2)',
          color: 'var(--hi)',
          fontSize: 13,
          fontWeight: 500
        }}>Add link</button>
        <input ref={fileRef} type="file" accept="audio/*" multiple style={{ display: 'none' }}
        onChange={(e) => {addFiles(e.target.files);e.target.value = '';}} />
      </div>
      }
      {err && <div className="mono" style={{ fontSize: 10, color: '#FF8A8A', letterSpacing: '0.1em', marginTop: -16 }}>
        COULDN'T READ THAT LINK · USE A SPOTIFY OR SOUNDCLOUD URL
      </div>}

      {/* MP3 tracks */}
      {tracks.length > 0 &&
      <div className="reveal" style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          <div className="eyebrow">TRACKS</div>
          {tracks.map((t, i) =>
        <div key={i} style={{
          display: 'flex', alignItems: 'center', gap: 14,
          padding: '14px 18px',
          border: '1px solid var(--line)',
          borderRadius: 12,
          background: 'var(--ink-2)'
        }}>
              <Waveform height={26} lines={4} opacity={0.8} speed={9} amplitude={0.9} />
              <div style={{ flex: 2, minWidth: 160 }}>
                <div style={{ fontSize: 14, fontWeight: 500, color: 'var(--hi)', fontFamily: 'var(--display)' }}>{t.name}</div>
              </div>
              <audio controls src={t.url} style={{ flex: 3, height: 36, minWidth: 200 }} />
              {ed &&
              <button onClick={() => removeTrack(i)} title="Remove" style={{
            width: 28, height: 28, borderRadius: '50%',
            border: '1px solid var(--line-2)',
            color: 'var(--fog)', fontSize: 12,
            display: 'grid', placeItems: 'center', flexShrink: 0
          }}>✕</button>
              }
            </div>
        )}
        </div>
      }

      {/* Streaming embeds */}
      {links.length > 0 &&
      <div className="reveal" style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
          <div className="eyebrow">STREAMING</div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(340px, 1fr))', gap: 12 }}>
            {links.map((l, i) =>
          <div key={i} style={{ position: 'relative' }}>
                <iframe src={l.src} title={`audio-${i}`}
            style={{ width: '100%', height: l.h, border: 0, borderRadius: 12, background: 'var(--ink-2)' }}
            allow="encrypted-media"></iframe>
                {ed &&
                <button onClick={() => removeLink(i)} title="Remove" style={{
            position: 'absolute', top: -8, right: -8,
            width: 24, height: 24, borderRadius: '50%',
            border: '1px solid var(--line-2)',
            background: 'var(--ink)',
            color: 'var(--fog)', fontSize: 11,
            display: 'grid', placeItems: 'center'
          }}>✕</button>
                }
              </div>
          )}
          </div>
        </div>
      }

      {tracks.length === 0 && links.length === 0 &&
      <div className="mono" style={{
        padding: '40px 20px',
        textAlign: 'center',
        border: '1px dashed var(--line-2)',
        borderRadius: 12,
        fontSize: 11,
        letterSpacing: '0.14em',
        color: 'var(--mute)'
      }}>
          NO AUDIO YET · ADD MP3S OR PASTE SPOTIFY / SOUNDCLOUD LINKS ABOVE
        </div>
      }
    </div>);

};

  },
  {

    copy: 'Certified sound engineering for live corporate events, conferences, streams, and podcasts. From rig build and room mix to multi-mic recording and broadcast-clean post, delivered live, with no second takes.',
    tags: ['LIVE SOUND', 'EVENTS', 'PODCASTS', 'AUDIO POST']
  },

    plain: 'I plan the strategy, set the creative vision and make sure your content reaches the right people and turns attention into sales.',
    copy: 'Data-driven digital marketing paired with senior creative direction: channel strategy, content calendars, targeted campaigns and a consistent brand voice across platforms, built to convert attention into measurable growth rather than vanity metrics.',
    tags: ['STRATEGY', 'CAMPAIGNS', 'ANALYTICS', 'BRAND VOICE']
  }];

  // ── Owner-editable layout: card order + per-card height ──
  const LAYOUT_KEY = 'pp-home-srv-layout';
  const loadLayout = () => {
    try {
      const j = JSON.parse(localStorage.getItem(LAYOUT_KEY));
      if (j && Array.isArray(j.order)) return { order: j.order, size: j.size || {} };
    } catch (e) {}
    return { order: services.map((s) => s.no), size: {} };
  };
  const [layout, setLayout] = React.useState(loadLayout);
  const saveLayout = (next) => {
    setLayout(next);
    try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(next)); if (window.PPStore) window.PPStore.persist(LAYOUT_KEY); } catch (e) {}
  };
  // ordered list — unknown/stale nos dropped, new services appended
  const ordered = layout.order.map((no) => services.find((s) => s.no === no)).filter(Boolean)
    .concat(services.filter((s) => !layout.order.includes(s.no)));
  const moveCard = (no, dir) => {
    const o = ordered.map((s) => s.no);
    const i = o.indexOf(no), j = i + dir;
    if (j < 0 || j >= o.length) return;
    [o[i], o[j]] = [o[j], o[i]];
    saveLayout({ ...layout, order: o });
  };
  const sizeCard = (no, dir) => {
    const cur = layout.size[no] || 0;
    const next = Math.max(-120, Math.min(240, cur + dir * 40));
    saveLayout({ ...layout, size: { ...layout.size, [no]: next } });
  };

  return (

        <ExpertiseGraph />


        {/* Alternating rows — each slides in from its own side on scroll.
            Order + heights are owner-editable (arrows / ± in edit mode). */}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
          {ordered.map((s, i) =>
            <ServiceSlideRow key={s.no} service={s} idx={i}
              extra={layout.size[s.no] || 0}
              onMove={window.PP_EDITABLE ? (dir) => moveCard(s.no, dir) : null}
              onSize={window.PP_EDITABLE ? (dir) => sizeCard(s.no, dir) : null}
              first={i === 0} last={i === ordered.length - 1} />
          )}
        </div>
        <div style={{ marginTop: 32, display: 'flex', justifyContent: 'flex-end' }}>
          <div style={{ zoom: 1.3 }}>
          <Pill variant="ghost" onClick={() => setRoute({ page: 'services' })} icon>
            All services in detail
          </Pill>
          </div>
        </div>

      <style>{`
        @media (max-width: 800px) {
          /* Single column on small screens, but keep the SAME reading order as
             desktop (text then image) so the arrangement matches everywhere. */
          .svc-slide { grid-template-columns: 1fr !important; }
          .svc-slide .srv-text { order: 1 !important; }

      `}</style>

const saveTB = (v) => { try { localStorage.setItem(TB_KEY, JSON.stringify(v)); if (window.PPStore) window.PPStore.persist(TB_KEY); } catch (e) {} };

const TrustedBy = ({ direction }) => {
  const [tb, setTb] = React.useState(loadTB);
  const [edit, setEdit] = React.useState(false);
  const ed = window.PP_EDITABLE;
  React.useEffect(() => { saveTB(tb); }, [tb]);

  const addLogo = (row) => {
    const n = Date.now().toString(36);
    setTb({ ...tb, [row]: [...tb[row], {
      key: 'brand-' + n, src: '', name: 'New brand',
      w: row === 'primary' ? 'clamp(110px,14vw,180px)' : 'clamp(96px,12vw,150px)'
    }] });
  };
  const removeLogo = (row, key) => setTb({ ...tb, [row]: tb[row].filter((x) => x.key !== key) });
  const scaleLogo = (row, key, dir) => setTb({ ...tb, [row]: tb[row].map((x) =>
    x.key === key ? { ...x, scale: Math.round(Math.max(0.5, Math.min(3, (x.scale || 1) + dir * 0.15)) * 100) / 100 } : x) });
  const moveLogo = (row, key, dir) => {
    const a = [...tb[row]];
    const i = a.findIndex((x) => x.key === key);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= a.length) return;
    [a[i], a[j]] = [a[j], a[i]];
    setTb({ ...tb, [row]: a });
  };

  const chip = (onClick, title, txt) =>
    <button onClick={onClick} title={title} className="mono" style={{
      width: 20, height: 20, borderRadius: '50%', display: 'grid', placeItems: 'center',

          position: 'absolute', top: -26, left: '50%', transform: 'translateX(-50%)',

        }}>

          {chip(() => scaleLogo(row, p.key, 1), 'Bigger', '＋')}

          {chip(() => moveLogo(row, p.key, 1), 'Move right', '→')}
        </div>
      }
    </div>;

  const addBtn = (row) =>
    <button onClick={() => addLogo(row)} className="mono" title="Add a logo slot, then drop the logo image onto it" style={{
      height: 'clamp(40px, 5vw, 60px)', minWidth: 90, padding: '0 18px',

      color: 'var(--mute)', fontSize: 10, letterSpacing: '0.14em', cursor: 'pointer'
    }}>＋ LOGO</button>;

  return (
    <section style={{
      padding: 'clamp(80px, 12vh, 140px) var(--pad)',
      borderTop: '1px solid var(--line)'
    }}>
      <div className="wrap" style={{ padding: 0 }}>

              Trusted <em style={{ color: "rgb(108, 0, 142)" }}>by.</em>
            </h2>
          </div>
          {ed &&
            <button onClick={() => setEdit(!edit)} className="mono" style={{
              padding: '9px 16px', borderRadius: 99,
              border: `1px solid ${edit ? 'var(--violet)' : 'var(--line-2)'}`,
              background: edit ? 'var(--violet)' : 'transparent',
              color: edit ? '#fff' : 'var(--fog)',
              fontSize: 10, letterSpacing: '0.14em', cursor: 'pointer'
            }}>{edit ? '✓ DONE' : '✎ EDIT LOGOS'}</button>
          }
        </div>

        {/* Primary marks — large, with hairline dividers */}
        <div className="reveal tb-primary" style={{
          display: 'flex', flexWrap: 'wrap',
          alignItems: 'center', justifyContent: 'space-between',
          gap: 'clamp(28px, 5vw, 72px)',

          borderBottom: '1px solid var(--line)'

          {tb.primary.map((p, i) =>
          <React.Fragment key={p.key}>
              {slotWithTools('primary')(p, i, tb.primary.length)}

            </React.Fragment>
          )}
          {ed && edit && addBtn('primary')}
        </div>

        {/* Connector line */}
        <div className="reveal" style={{
          display: 'flex', alignItems: 'center', gap: 18,
          margin: 'clamp(36px, 5vh, 56px) 0'
        }}>
          <span style={{ flex: 1, height: 1, background: 'linear-gradient(90deg, transparent, var(--line))' }} />

        </div>

        {/* Secondary marks — smaller */}
        <div className="reveal tb-secondary" style={{
          display: 'flex', flexWrap: 'wrap',
          alignItems: 'center', justifyContent: 'center',
          gap: 'clamp(28px, 6vw, 80px)'
        }}>
          {tb.secondary.map((s, i) => slotWithTools('secondary')(s, i, tb.secondary.length))}
          {ed && edit && addBtn('secondary')}
        </div>
      </div>

      <style>{`
        .tb-logo {
          height: clamp(40px, 5vw, 60px);
          display: inline-flex; align-items: center; justify-content: center;
          opacity: 0.62;
          transition: opacity .35s ease, transform .35s ease;

          0%, 86%, 100% { opacity: 0.5; }
          93% { opacity: 1; }
        }
        @media (prefers-reduced-motion: reduce) {
          .tb-logo { animation: none !important; opacity: 0.7; }
        }
        @media (max-width: 720px) {
          .tb-div { display: none; }
          /* Uneven logo widths + wrapping made rows look off-centre. A symmetric
             grid gives every mark an equal cell, so each row centres exactly. */
          .tb-primary { display: grid !important; grid-template-columns: repeat(2, 1fr) !important;
            justify-content: stretch !important; justify-items: center !important;
            align-items: center !important; gap: clamp(24px, 6vw, 40px) !important; }
          .tb-secondary { display: grid !important; grid-template-columns: repeat(3, 1fr) !important;
            justify-items: center !important; align-items: center !important;
            gap: clamp(20px, 5vw, 32px) !important; }
          .tb-slotwrap { width: 100%; display: flex; justify-content: center; }
          .tb-logo { width: 100%; max-width: 100%; }
          .tb-logo image-slot { max-width: 100% !important; }
        }
        @media (max-width: 400px) {
          .tb-secondary { grid-template-columns: repeat(2, 1fr) !important; }
        }
      `}</style>
    </section>);

function migrateV3(a) {
  if (a.some((c) => c.id === 'global-marketing' || (c.subs && c.subs.length))) return a;
  if (!a.some((c) => GROUP_SUB_IDS.includes(c.id))) return a;
  const out = [];
  let placed = false;
  for (const c of a) {
    if (GROUP_SUB_IDS.includes(c.id)) {
      if (!placed) {
        out.push({ ...GROUP_CARD, subs: a.filter((x) => GROUP_SUB_IDS.includes(x.id)).map((x) => ({ id: x.id, label: x.title })) });
        placed = true;
      }
    } else out.push(c);
  }
  return migrateV4(out);
}

// v5 → v6: dedicated Video & Social card added (hosts the showreel).
function migrateV5(a) {
  if (a.some((c) => c.id === 'video-social')) return a;
  return [VIDEO_CARD, ...a];
}

// v4 → v5: restaurants moved from its own card into the group card's links.
function migrateV4(a) {
  const rest = a.find((c) => c.id === 'restaurants');
  const group = a.find((c) => c.id === 'global-marketing');
  if (!rest || !group) return a;
  if (!(group.subs || []).some((s) => s.id === 'restaurants')) {
    group.subs = [...(group.subs || []), { id: 'restaurants', label: rest.title }];
  }
  return migrateV5(a.filter((c) => c.id !== 'restaurants'));
}

const withDefaults = (c) => ({ ...patchLegacy(c), sections: { ...DEFAULT_SECTIONS, ...(c.sections || {}) } });

  'oireachtas': ['Live Broadcast', 'Oireachtas TV: Live Broadcast'],
  'global-marketing': ['Global Marketing & Creative Direction', 'Multimedia Production & Global Marketing'],
};
function patchLegacy(c) {
  const olds = LEGACY_TITLES[c.id];
  if (!olds || !olds.includes(c.title || '')) return c;
  const d = DEFAULT_CASES.find((x) => x.id === c.id);
  if (!d) return c;
  // Group card: refresh the title only (its blurb/client/subs may be user-edited)
  if (c.id === 'global-marketing') return { ...c, title: d.title };
  return { ...c, title: d.title, blurb: d.blurb, tags: d.tags, discipline: d.discipline, client: d.client, year: d.year };
}

function loadStack() {
  try {
    const raw = localStorage.getItem(STACK_KEY);
    if (raw) {const a = JSON.parse(raw);if (Array.isArray(a) && a.length) return a.map(withDefaults);}

    const old = localStorage.getItem('pp-work-stack-v3');
    if (old) {const a = JSON.parse(old);if (Array.isArray(a) && a.length) return migrateV3(a).map(withDefaults);}
  } catch (e) {}

}

          // anything moves; the flick then plays out over the remainder.
          const DEAD = 0.42;
          t = raw <= DEAD ? 0 : (raw - DEAD) / (1 - DEAD);
        }
        // Ease the raw progress so the flick starts gently and commits firmly.
        const e = t * t * (3 - 2 * t); // smoothstep
        // Two-phase flick: first half = the card KICKS UP and tilts back
        // (like a thumb lifting its edge); second half = it drops behind the
        // pile, sinking and fading. Alternate the swing direction per card so
        // riffling down the stack feels hand-made rather than mechanical.
        const kick = Math.sin(e * Math.PI); // rises then falls
        const sink = Math.max(0, e - 0.45) / 0.55; // second phase only
        const dir = i % 2 === 0 ? 1 : -1;
        const scale = 1 - 0.10 * e;
        const lift = -34 * kick + 26 * sink; // up first, then settles down-behind
        const tiltX = -16 * kick - 4 * sink; // strong edge-lift, relaxes as it lands
        const swing = dir * 2.6 * kick; // slight off-axis rotation, like a real flick
        body.style.transform = `perspective(1100px) translateY(${lift.toFixed(1)}px) rotateX(${tiltX.toFixed(2)}deg) rotateZ(${swing.toFixed(2)}deg) scale(${scale.toFixed(3)})`;
        body.style.transformOrigin = 'center top';
        body.style.filter = `brightness(${1 - 0.45 * e}) blur(${(2.5 * e).toFixed(2)}px)`;
        body.style.willChange = 'transform, filter';
        // Incoming card: arrives with a counter-swing + tilt that snaps flat.
        if (i > 0) {
          const prevT = (() => {
            const stickP = 96 + (i - 1) * 18;
            const myTop = card.getBoundingClientRect().top;
            const raw = Math.max(0, Math.min(1, (vh - myTop) / Math.max(1, vh - stickP)));
            const DEAD = 0.42;
            return raw <= DEAD ? 0 : (raw - DEAD) / (1 - DEAD);
          })();
          const arrive = 1 - Math.max(0, Math.min(1, prevT));
          const aDir = (i - 1) % 2 === 0 ? -1 : 1;
          card.style.transform = arrive > 0.001
            ? `perspective(1100px) rotateX(${(5 * arrive).toFixed(2)}deg) rotateZ(${(aDir * 1.6 * arrive).toFixed(2)}deg)`
            : '';
          card.style.transformOrigin = 'center bottom';
        }
        // Shadow deepens during the flick's peak, selling the lift.
        body.style.boxShadow = e > 0.02
          ? `0 ${Math.round(16 + 44 * kick + 14 * e)}px ${Math.round(50 + 70 * kick)}px rgba(0,0,0,${(0.35 + 0.3 * kick).toFixed(2)})`
          : '';
      });
    };
    const onScroll = () => { if (!raf) raf = requestAnimationFrame(apply); };
    apply();
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll, { passive: true });
    return () => {
      if (raf) cancelAnimationFrame(raf);
      window.removeEventListener('scroll', onScroll);
      window.removeEventListener('resize', onScroll);
    };
  }, [cases.length, edit]);

  const update = (idx, patch) => setCases((cs) => cs.map((c, i) => i === idx ? { ...c, ...patch } : c));
  const setSection = (idx, key, val) => setCases((cs) => cs.map((c, i) =>

  const move = (idx, dir) => setCases((cs) => {
    const j = idx + dir;if (j < 0 || j >= cs.length) return cs;
    const a = cs.slice();const t = a[idx];a[idx] = a[j];a[j] = t;return a;
  });
  const del = (idx) => setCases((cs) => cs.filter((_, i) => i !== idx));
  const dup = (idx) => setCases((cs) => {
    const copy = withDefaults({ ...cs[idx], id: 'new-' + Date.now().toString(36) });
    const a = cs.slice();a.splice(idx + 1, 0, copy);return a;
  });
  const add = () => setCases((cs) => [...cs, templateCard()]);
  const reset = () => {if (confirm('Reset the stack to the default cards? Your card edits will be lost.')) setCases(DEFAULT_CASES.map(withDefaults));};

  stubStyle={{ alignSelf: 'center', justifySelf: 'center', margin: 'auto' }}>

// ── Hero media renderer ──────────────────────────────────────
// Editable external-link video — links straight out (e.g. to Oireachtas TV),
// with a labelled card and an editable/persistent URL. Not an embed.
const ExternalLinkSlot = ({ id, label, defaultUrl, accent }) => {
  const KEY = `pp-extlink-${id}`;
  const [url, setUrl] = React.useState(() => {
    const saved = localStorage.getItem(KEY);
    return saved != null ? saved : (defaultUrl || '');
  });
  const [editing, setEditing] = React.useState(false);
  const [draft, setDraft] = React.useState(url);
  const [hover, setHover] = React.useState(false);

  const save = () => {
    const v = draft.trim();
    setUrl(v);
    localStorage.setItem(KEY, v);
    if (window.PPStore) window.PPStore.persist(KEY);
    setEditing(false);
  };

  return (
    <div
      onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
      style={{
        position: 'relative', borderRadius: 16, overflow: 'hidden',
        border: '1px solid var(--line)', background: 'var(--ink-2)',
        display: 'flex', flexDirection: 'column',
      }}>
      {/* Play / link face */}
      <a href={url || undefined} target="_blank" rel="noopener noreferrer"
        onClick={(e) => { if (!url) e.preventDefault(); }}
        style={{
          position: 'relative', aspectRatio: '16/10', display: 'flex',
          flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 14,
          textDecoration: 'none', cursor: url ? 'pointer' : 'default',
          background: `linear-gradient(150deg, ${accent}33 0%, var(--ink-2) 70%)`,
        }}>
        <span style={{
          width: 58, height: 58, borderRadius: '50%', background: 'var(--paper)', color: 'var(--ink)',
          display: 'grid', placeItems: 'center', boxShadow: '0 10px 30px rgba(0,0,0,0.4)',
          transform: hover && url ? 'scale(1.06)' : 'scale(1)', transition: 'transform .2s ease',
        }}>
          <svg width="18" height="20" viewBox="0 0 22 24" fill="none"><path d="M20 12L1 23V1L20 12Z" fill="currentColor"/></svg>
        </span>
        <span className="mono" style={{
          fontSize: 10, letterSpacing: '0.16em', color: 'var(--paper-dim)',
          padding: '7px 14px', border: '1px solid var(--line-2)', borderRadius: 99,
        }}>
          {url ? 'WATCH ON OIREACHTAS.IE ↗' : 'NO LINK YET'}
        </span>
      </a>

      {/* Label + edit control */}
      <div style={{ padding: '16px 18px', borderTop: '1px solid var(--line)' }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10 }}>
          <h3 className="display" style={{ fontSize: 'clamp(18px, 1.6vw, 22px)' }}>{label}</h3>
          {!editing && window.PP_EDITABLE &&
            <button onClick={() => { setDraft(url); setEditing(true); }} className="mono" style={{
              fontSize: 10, letterSpacing: '0.1em', color: 'var(--violet-3)', cursor: 'pointer',
              border: '1px solid var(--line-2)', borderRadius: 99, padding: '5px 11px', background: 'transparent',
            }}>EDIT LINK</button>
          }
        </div>
        {editing &&
          <div style={{ display: 'flex', gap: 6, marginTop: 12 }}>
            <input
              value={draft}
              onChange={(e) => setDraft(e.target.value)}
              onKeyDown={(e) => { if (e.key === 'Enter') save(); if (e.key === 'Escape') setEditing(false); }}
              placeholder="Paste an Oireachtas video URL"
              autoFocus
              style={{
                flex: 1, minWidth: 0, padding: '9px 12px', borderRadius: 8, border: '1px solid var(--line-2)',
                background: 'rgba(0,0,0,0.4)', color: 'var(--hi)', fontSize: 12, fontFamily: 'var(--sans)', outline: 'none',
              }} />
            <button onClick={save} style={{
              padding: '9px 14px', borderRadius: 8, background: 'var(--violet)', color: '#fff',
              fontSize: 12, fontWeight: 500, border: 0, cursor: 'pointer', whiteSpace: 'nowrap',
            }}>Save</button>
          </div>
        }
      </div>
    </div>
  );
};

const CaseHeroMedia = ({ id, data }) => {
  // Always prefer the canonical CASE_DATA media config (it carries slot +
  // noFallback pins) over any stored/stack-derived copy that may lack them —
  // this is what guarantees e.g. the restaurants case NEVER shows the showreel.
  const canon = (typeof CASE_DATA !== 'undefined' && CASE_DATA[id] && CASE_DATA[id].media) || null;
  const base = data.media || { type: 'image', img: PROD_STILLS[0] };
  const m = (canon && canon.type === 'showreel') ? { ...base, ...canon } : base;

  // Multiple labelled external links (e.g. Oireachtas: Committee / Seanad / Dáil)
  if (m.type === 'extlinks') {
    return (
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 16 }} className="extlinks-grid">
        {(m.items || []).map((it) => (
          <ExternalLinkSlot key={it.key} id={`cs-${id}-${it.key}`} label={it.label} defaultUrl={it.url} accent={data.accent}/>
        ))}
        <style>{`@media (max-width: 760px){ .extlinks-grid{ grid-template-columns:1fr !important; } }`}</style>
      </div>
    );
  }

  // The showreel — same slot as My Work (id "myreel-showreel"), so the reel
  // set there plays here automatically. A case can carry its OWN slot instead
  // (m.slot): in edit mode that slot always shows so the owner can fill it;
  // publicly it shows when filled, else falls back to the shared showreel —
  // unless m.noFallback is set (e.g. restaurants), which pins the case to its
  // own video and NEVER substitutes the showreel.
  if (m.type === 'showreel') {
    const own = m.slot;
    const ownFilled = own && (() => {
      try {
        if (localStorage.getItem('pp-video-link-' + own)) return true;
        const e = window.__PP_EMBED__ && window.__PP_EMBED__.state;
        return !!(e && e['pp-video-link-' + own]);
      } catch (x) { return false; }
    })();
    const sid = own && (m.noFallback || window.PP_EDITABLE || ownFilled) ? own : 'myreel-showreel';
    return (
      <div>
        <VideoLinkSlot id={sid} label={sid === 'myreel-showreel' ? 'Showreel' : (m.noFallback ? 'Case video' : 'Case video (empty = showreel shows publicly)')} aspect="21/9" big />
        {m.note &&
          <p className="mono" style={{ fontSize: 11, letterSpacing: '0.1em', color: 'var(--mute)', marginTop: 12, textAlign: 'center' }}>
            {m.note.toUpperCase()}
          </p>
        }
      </div>
    );
  }

  return (
    <div>
      {/* linkslot sizes ITSELF to the video's real aspect ratio (GlassPlayer
          auto-detects it), so it must not be forced into a 21/9 box. */}
      {m.type === 'linkslot' ?
        <VideoLinkSlot id={`cs-${id}-film`} label={m.label || 'Add a film link'} aspect="21/9" big lockPublic={!!m.lockPublic} />
      :
      <div style={{
        width: '100%', aspectRatio: '21/9',
        borderRadius: 16, overflow: 'hidden', position: 'relative',
        background: `linear-gradient(135deg, ${data.accent}44 0%, ${data.accent}11 50%, var(--ink-2) 100%)`,
        border: '1px solid var(--line)',
      }}>
        {m.type === 'embed' &&
          <iframe src={m.embed} title={data.title}
            referrerPolicy="strict-origin-when-cross-origin"
            style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', border: 0 }}
            allow="autoplay; fullscreen; picture-in-picture" allowFullScreen></iframe>
        }
        {m.type === 'image' &&
          <image-slot id={`cs-${id}-hero`} src={m.img} placeholder="Drop a hero image" shape="rect"
            style={{ position: 'absolute', inset: 0, width: '100%', height: '100%' }}></image-slot>
        }
        {m.type === 'external' &&
          <a href={m.url} target="_blank" rel="noopener noreferrer"
            style={{
              position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column',
              alignItems: 'center', justifyContent: 'center', gap: 18, textDecoration: 'none',
              background: `linear-gradient(135deg, ${data.accent}33 0%, var(--ink-2) 100%)`
            }}>
            <span style={{
              width: 76, height: 76, borderRadius: '50%',
              background: 'var(--paper)', color: 'var(--ink)',
              display: 'grid', placeItems: 'center',
              boxShadow: '0 12px 40px rgba(0,0,0,0.4)'
            }}>
              <svg width="22" height="24" viewBox="0 0 22 24" fill="none"><path d="M20 12L1 23V1L20 12Z" fill="currentColor"/></svg>
            </span>
            <span className="display" style={{ fontSize: 'clamp(24px, 3vw, 38px)', color: 'var(--hi)' }}>
              {m.label || 'Watch the broadcast'}
            </span>
            <span className="mono" style={{
              fontSize: 11, letterSpacing: '0.16em', color: 'var(--paper-dim)',
              display: 'inline-flex', alignItems: 'center', gap: 8,
              padding: '8px 16px', border: '1px solid var(--line-2)', borderRadius: 99
            }}>
              OIREACHTAS.IE ↗
            </span>
          </a>
        }
      </div>
      }
      {m.note &&
        <p className="mono" style={{ fontSize: 11, letterSpacing: '0.1em', color: 'var(--mute)', marginTop: 12, textAlign: 'center' }}>
          {m.note.toUpperCase()}
        </p>
      }
    </div>
  );
};

const CaseStudy = ({ id, setRoute }) => {
  const data = CASE_DATA[id] || fallbackCase;

  const [progress, setProgress] = React.useState(0);
  React.useEffect(() => {
    const onScroll = () => {
      const max = document.body.scrollHeight - window.innerHeight;
      setProgress(Math.min(1, window.scrollY / Math.max(max, 1)));
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, [id]);

  // Curated recommendations per case; fall back to the generic stack order.
  // Marketing cases → video work + restaurants; live events ↔ corporate AV.
  const REC_MAP = {
    'global-marketing': ['video-social', 'restaurants'],
    'eirsat-1': ['video-social', 'restaurants'],
    'hytropics': ['video-social', 'restaurants'],
    'change-of-air': ['video-social', 'restaurants'],
    'oireachtas': ['pwc-live-av'],
    'pwc-live-av': ['oireachtas'],
    'video-social': ['restaurants', 'global-marketing'],
    'restaurants': ['video-social', 'global-marketing'],
  };
  const pool = (window.CASES || []).filter(p => p.id !== id && !(p.subs && p.subs.length));
  const recIds = (REC_MAP[id] || []).filter(r => r !== id);
  // A recommendation can be a top-level card OR a sub-case that only exists
  // in CASE_DATA (e.g. restaurants inside the marketing group card).
  const fromData = (r) => {
    const d = CASE_DATA[r];
    if (!d) return null;
    return { id: r, title: d.title, client: d.client, year: d.year, accent: d.accent, poster: (typeof GC_POSTER_FALLBACK !== 'undefined' && GC_POSTER_FALLBACK[r]) || '' };
  };
  const recs = recIds.map(r => pool.find(p => p.id === r) || fromData(r)).filter(Boolean);
  const related = [...recs, ...pool.filter(p => !recIds.includes(p.id))].slice(0, 3);

  // Back to the case-study stack on My Work (the browser Back button may leave
  // the site entirely, so this floating arrow is the reliable way to resume
  // browsing). After the route change, settle the scroll on the stack itself.
  const backToStack = () => {
    setRoute({ page: 'work' });
    setTimeout(() => {
      const stack = document.querySelector('.case-stack');
      if (stack) {
        const y = stack.getBoundingClientRect().top + window.scrollY - 90;
        window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
      }
    }, 450);
  };

  return (
    <main style={{ paddingTop: 80 }}>
      {/* Floating back arrow — always available while reading a case study */}
      <button onClick={backToStack} aria-label="Back to case studies" title="Back to case studies"

        style={{
          position: 'fixed', top: 96, left: 'max(16px, calc(var(--pad) - 8px))', zIndex: 50,
          width: 46, height: 46, borderRadius: '50%', cursor: 'pointer',

          color: '#fff', background: 'rgba(10,4,16,0.45)',
          border: '1px solid rgba(255,255,255,0.18)',
          backdropFilter: 'blur(18px) saturate(160%)', WebkitBackdropFilter: 'blur(18px) saturate(160%)',
          boxShadow: '0 10px 30px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.14)',
          transition: 'background .2s ease, transform .2s ease',
        }}
        onMouseEnter={(e) => { e.currentTarget.style.background = 'rgba(114,0,148,0.6)'; e.currentTarget.style.transform = 'scale(1.06)'; }}
        onMouseLeave={(e) => { e.currentTarget.style.background = 'rgba(10,4,16,0.45)'; e.currentTarget.style.transform = 'scale(1)'; }}>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M19 12H5"></path><path d="m11 18-6-6 6-6"></path>

      {/* Progress bar */}
      <div style={{ position: 'fixed', top: 76, left: 0, right: 0, height: 2, zIndex: 49, background: 'rgba(255,255,255,0.04)' }}>

                style={{ width: '100%', height: '100%', display: 'block', background: 'var(--ink-2)', border: '1px solid var(--line)', borderRadius: 12 }}></image-slot>

            </div>
            <div style={{ gridColumn: 'span 3', aspectRatio: '4/3' }}>
              <image-slot id={`cs-${id}-still-5`} src={PROD_STILLS[4]} placeholder="Drop still 05" shape="rounded" radius="12"
                style={{ width: '100%', height: '100%', display: 'block', background: 'var(--ink-2)', border: '1px solid var(--line)', borderRadius: 12 }}></image-slot>

          .gallery-grid{ grid-template-columns:repeat(2,1fr) !important; grid-auto-rows:auto !important; gap:8px !important; }
          .gallery-grid>div{ grid-column:span 2 !important; grid-row:auto !important; aspect-ratio:16/10 !important; }
          .gallery-grid>div:nth-child(2), .gallery-grid>div:nth-child(3),
          .gallery-grid>div:nth-child(4), .gallery-grid>div:nth-child(5){ grid-column:span 1 !important; aspect-ratio:1/1 !important; }
          /* Kill the desktop min-height that made slots overflow their rows and

        }`}</style>

      }

      {/* More work: optional video slots (video-social only) */}
      {data.moreVideos && <MoreVideos id={id} />}

      {/* Pinned related case (e.g. the restaurant work under Video & Social) */}
      {(data.relatedIds || []).map((rid) => {
        const d = CASE_DATA[rid];
        if (!d) return null;
        return (
          <section key={rid} style={{ padding: 'clamp(50px, 8vh, 90px) var(--pad) 0' }}>
            <div className="wrap" style={{ padding: 0 }}>
              <div className="eyebrow" style={{ marginBottom: 20 }}>◆ CASE STUDY IN THIS PRACTICE</div>
              <button onClick={() => { setRoute({ page: 'case', id: rid }); window.scrollTo(0, 0); }}

                style={{ position: 'relative', display: 'block', width: '100%', minHeight: 240, borderRadius: 18, overflow: 'hidden',

// ────────────────────────────────────────────────────────────
// GroupCase — landing page for a stack card that holds several case
// studies (e.g. Global Marketing). Shows the selection with the same
// cover previews used on the Work stack (shared image-slot ids).
// ────────────────────────────────────────────────────────────
const GC_POSTER_FALLBACK = {
  'eirsat-1': 'https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?auto=format&fit=crop&w=1200&q=80',
  'restaurants': 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1200&q=80'
};

// ── MoreVideos — up to six optional owner-filled video slots shown as a
// glass carousel (one at a time, arrows + dots), so a short list never looks
// sparse. Public: only filled slots become slides; empty = no section.
const MoreVideos = ({ id }) => {
  const ed = window.PP_EDITABLE;
  const all = [1, 2, 3, 4, 5, 6];
  const has = (n) => {
    try {
      if (localStorage.getItem(`pp-video-link-mv-${id}-${n}`)) return true;
      const e = window.__PP_EMBED__ && window.__PP_EMBED__.state;
      return !!(e && e[`pp-video-link-mv-${id}-${n}`]);
    } catch (x) { return false; }
  };
  // Owner-set slide order (edit mode arrows below); persists into the build.
  const ORDER_KEY = `pp-mv-order-${id}`;
  const loadOrder = () => {
    try {
      const raw = localStorage.getItem(ORDER_KEY) ||
        (window.__PP_EMBED__ && window.__PP_EMBED__.state && window.__PP_EMBED__.state[ORDER_KEY]);
      const a = JSON.parse(raw);
      if (Array.isArray(a)) return a.filter((n) => all.includes(n)).concat(all.filter((n) => !a.includes(n)));
    } catch (x) {}
    return all;
  };
  const [order, setOrder] = React.useState(loadOrder);
  const [i, setI] = React.useState(0);
  const slides = ed ? order : order.filter(has);
  if (!slides.length) return null;
  const n = slides.length;
  const cur = slides[Math.min(i, n - 1)];
  const go = (d) => setI((p) => (p + d + n) % n);
  const move = (d) => {
    const k = order.indexOf(cur), j = k + d;
    if (j < 0 || j >= order.length) return;
    const a = [...order];
    [a[k], a[j]] = [a[j], a[k]];
    setOrder(a); setI(j);
    try { localStorage.setItem(ORDER_KEY, JSON.stringify(a)); } catch (x) {}
    if (window.PPStore) window.PPStore.persist(ORDER_KEY);
  };
  return (
    <section style={{ padding: 'clamp(50px, 8vh, 90px) var(--pad) 0' }}>
      <div className="wrap" style={{ padding: 0 }}>
        <SectionHeading kicker="◆ MORE WORK" title={<>More <em style={{ color: 'rgb(124,0,162)' }}>examples.</em></>} />
        {ed && <p className="mono" style={{ fontSize: 10, letterSpacing: '0.12em', color: 'var(--mute)', margin: '-12px 0 20px' }}>
          OPTIONAL · USE THE ARROWS TO REACH ALL 6 SLOTS · EMPTY ONES NEVER SHOW ON THE PUBLIC SITE
        </p>}
        <div className="mv-car">
          <div className="mv-stage" key={cur}>
            <VideoLinkSlot id={`mv-${id}-${cur}`} label={ed ? `Extra video ${cur} (optional)` : 'Video'} big />
          </div>
          {n > 1 &&
            <>
              <button className="mv-nav mv-prev" onClick={() => go(-1)} aria-label="Previous video">‹</button>
              <button className="mv-nav mv-next" onClick={() => go(1)} aria-label="Next video">›</button>
              <div className="mv-dots">
                {slides.map((s, k) => <button key={s} className={'mv-dot' + (k === Math.min(i, n - 1) ? ' on' : '')} onClick={() => setI(k)} aria-label={`Video ${k + 1} of ${n}`}></button>)}
              </div>
            </>
          }
          {ed && n > 1 &&
            <div className="mono" style={{ display: 'flex', gap: 10, alignItems: 'center', justifyContent: 'center', marginTop: 12, fontSize: 9.5, letterSpacing: '0.14em', color: 'var(--mute)' }}>
              REORDER:
              <button onClick={() => move(-1)} title="Move this video earlier" className="mono" style={{ padding: '5px 12px', borderRadius: 99, border: '1px solid var(--line-2)', background: 'rgba(0,0,0,0.5)', color: 'var(--fog)', cursor: 'pointer', fontSize: 11 }}>◀ EARLIER</button>
              <span>POSITION {order.indexOf(cur) + 1} / {order.length}</span>
              <button onClick={() => move(1)} title="Move this video later" className="mono" style={{ padding: '5px 12px', borderRadius: 99, border: '1px solid var(--line-2)', background: 'rgba(0,0,0,0.5)', color: 'var(--fog)', cursor: 'pointer', fontSize: 11 }}>LATER ▶</button>
            </div>
          }
        </div>
      </div>
      <style>{`
        .mv-car { position: relative; max-width: 920px; margin: 0 auto; }
        .mv-stage { animation: mv-in .45s cubic-bezier(.22,1,.36,1); }
        @keyframes mv-in { from { opacity: 0; transform: translateX(26px); } to { opacity: 1; transform: none; } }
        .mv-nav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 5;
          width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.25);
          background: rgba(8,4,14,0.55); color: #fff; font-size: 24px; line-height: 1; cursor: pointer;
          backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
          display: grid; place-items: center; transition: background .2s ease, transform .2s ease; }
        .mv-nav:hover { background: rgba(114,0,148,0.6); transform: translateY(-50%) scale(1.08); }
        .mv-prev { left: -16px; } .mv-next { right: -16px; }
        .mv-dots { display: flex; gap: 9px; justify-content: center; margin-top: 18px; }
        .mv-dot { width: 8px; height: 8px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
          background: rgba(255,255,255,0.25); transition: background .2s ease, transform .2s ease; }
        .mv-dot.on { background: #7C00A2; transform: scale(1.35); }
        @media (max-width: 760px) { .mv-prev { left: 6px; } .mv-next { right: 6px; } }
        @media (prefers-reduced-motion: reduce) { .mv-stage { animation: none; } }
