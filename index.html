  <script type="text/babel">
// App shell — routing + tweaks panel
const { useState, useEffect } = React;

const TWEAKS_DEFAULTS = /*EDITMODE-BEGIN*/{
  "direction": "cinematic",
  "accent": "#720094",
  "showGrain": true,
  "showMotion": true,
  "displayFont": "Barlow",
  "playerStyle": "frost"
}/*EDITMODE-END*/;

const App = () => {
  // ── History-aware routing, clean URL ──
  // Page changes are recorded as invisible history entries (route stored in
  // history.state, URL never changes) so the browser Back/Forward buttons
  // move through the site like a normal website while the address bar shows
  // only the domain. Old #/page links from earlier builds still resolve once,
  // then the hash is scrubbed from the URL.
  const initialRoute = () => {
    const seg = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    if (!seg.length) return { page: 'home' };
    const page = ['home', 'work', 'case', 'services', 'ai', 'contact'].includes(seg[0]) ? seg[0] : 'home';
    return seg[1] ? { page, id: decodeURIComponent(seg[1]) } : { page };
  };
  const [route, setRoute] = useState(initialRoute);
  const firstSync = React.useRef(true);
  useEffect(() => {
    if (firstSync.current) {
      // Seed the first entry (and scrub any legacy #/hash off the URL)
      history.replaceState({ pp: route }, '', location.pathname + location.search);
      firstSync.current = false;
      return;
    }
    const cur = history.state && history.state.pp;
    if (cur && cur.page === route.page && cur.id === route.id) return; // arrived via Back/Forward
    history.pushState({ pp: route }, '', location.pathname + location.search);
  }, [route.page, route.id]);
  useEffect(() => {
    const onPop = (e) => {
      const r = (e.state && e.state.pp) || { page: 'home' };
      setRoute((cur) => (cur.page === r.page && cur.id === r.id ? cur : r));
    };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);
  const [workCategory, setWorkCategory] = useState(null);
  // Intro logo animation plays on every full page load (not on client-side route changes)
  const [intro, setIntro] = useState(true);
  useEffect(() => {
    if (intro) document.body.classList.add('intro-wait');
    else document.body.classList.add('intro-done');
  }, []);
  const finishIntro = () => {
    document.body.classList.remove('intro-wait');
    setIntro(false);
  };
  const [tweaks, setTweak] = window.useTweaks(TWEAKS_DEFAULTS);

  // Reveal-on-scroll. NOTE: IntersectionObserver callbacks do not fire reliably
  // inside the preview iframe, which left every .reveal stuck at opacity:0.
  // This scroll/resize-driven check measures rects directly and is bulletproof.
  useEffect(() => {
    const reveal = () => {
      const vh = window.innerHeight || document.documentElement.clientHeight;
      document.querySelectorAll('.reveal:not(.rv-in)').forEach((el) => {
        const r = el.getBoundingClientRect();
        // In view (with a small bottom margin) OR already scrolled past the top.
        if (r.top < vh - 36 && r.bottom > 0) el.classList.add('rv-in');
      });
    };
    // Run a couple of times after paint so freshly-rendered nodes are caught.
    const ids = [requestAnimationFrame(reveal)];
    const t = setTimeout(reveal, 80);
    window.addEventListener('scroll', reveal, { passive: true });
    window.addEventListener('resize', reveal, { passive: true });
    return () => {
      ids.forEach(cancelAnimationFrame);
      clearTimeout(t);
      window.removeEventListener('scroll', reveal);
      window.removeEventListener('resize', reveal);
    };
  });

  // Apply tweaks to CSS vars
  useEffect(() => {
    document.documentElement.style.setProperty('--accent', tweaks.accent);
    document.documentElement.style.setProperty('--violet', tweaks.accent);
    document.documentElement.style.setProperty('--violet-glow', tweaks.accent + '73');
    document.documentElement.style.setProperty('--violet-soft', tweaks.accent + '1F');
    const root = document.body;
    if (tweaks.showGrain) root.classList.add('grain'); else root.classList.remove('grain');
    if (tweaks.showMotion === false) root.classList.add('no-motion'); else root.classList.remove('no-motion');
    document.body.dataset.player = tweaks.playerStyle || 'frost';
    document.documentElement.style.setProperty('--serif',
      tweaks.displayFont === 'Barlow' ? '"Barlow", sans-serif'
      : tweaks.displayFont === 'Libre Baskerville' ? '"Libre Baskerville", serif'
      : '"JetBrains Mono", monospace');
  }, [tweaks]);

  // Scroll to top + soft page transition on route change
  useEffect(() => {
    window.scrollTo({ top: 0, behavior: 'instant' });
    const shell = document.querySelector('.shell');
    if (shell && !document.body.classList.contains('no-motion')) {
      shell.classList.remove('page-enter');
      void shell.offsetWidth; // restart animation
      shell.classList.add('page-enter');
      const t = setTimeout(() => shell.classList.remove('page-enter'), 700);
      return () => clearTimeout(t);
    }
  }, [route.page, route.id]);

  const direction = tweaks.direction;

  let page = null;
  if (route.page === 'home') page = <Home direction={direction} setRoute={setRoute}/>;
  else if (route.page === 'work') page = <Work setRoute={setRoute} subRoute={workCategory} setSubRoute={setWorkCategory}/>;
  else if (route.page === 'case') {
    // A stack card with sub-links (e.g. Global Marketing) gets a selection
    // page showing the case studies inside it; plain ids open the case itself.
    const grpCard = (window.CASES || []).find((c) => c.id === route.id && c.subs && c.subs.length);
    page = grpCard ? <GroupCase card={grpCard} setRoute={setRoute}/> : <CaseStudy id={route.id || 'eirsat-1'} setRoute={setRoute}/>;
  }
  else if (route.page === 'services') page = <ServicesPage setRoute={setRoute}/>;
  else if (route.page === 'contact') page = <ContactPage setRoute={setRoute}/>;
  else page = <Home direction={direction} setRoute={setRoute}/>;

  return (
    <div className="shell" data-screen-label={`${route.page}${route.id ? '/' + route.id : ''}`}>
      <Nav route={route} setRoute={setRoute} direction={direction}/>
      {page}
      {intro && <IntroOverlay onDone={finishIntro}/>}
      <PersonalLayer route={route} setRoute={setRoute}/>
      <SiteTweaks tweaks={tweaks} setTweak={setTweak}/>
    </div>
  );
};

// Dedicated contact page
const ContactPage = ({ setRoute }) => (
  <main style={{ paddingTop: 80 }}>
    <Contact direction="cinematic"/>
    <Footer setRoute={setRoute}/>
  </main>
);

// ────────────────────────────────────────────────────────────
// Tweaks panel
// ────────────────────────────────────────────────────────────
const SiteTweaks = ({ tweaks, setTweak }) => {
  const { TweaksPanel, TweakSection, TweakRadio, TweakColor, TweakToggle, TweakSelect } = window;
  return (
    <TweaksPanel title="Tweaks">
      <TweakSection label="Design direction">
        <TweakSelect
          label="Direction"
          value={tweaks.direction}
          onChange={(v) => setTweak('direction', v)}
          options={[
            { value: 'cinematic', label: 'Cinematic · video hero' },
            { value: 'editorial', label: 'Editorial · magazine grid' },
            { value: 'generative', label: 'Generative · AI / mesh' },
          ]}
        />
      </TweakSection>

      <TweakSection label="Video player">
        <TweakRadio
          label="Glass style"
          value={tweaks.playerStyle}
          onChange={(v) => setTweak('playerStyle', v)}
          options={[
            { value: 'frost', label: 'Frost' },
            { value: 'ghost', label: 'Ghost' },
            { value: 'studio', label: 'Studio' },
          ]}
        />
      </TweakSection>

      <TweakSection label="Palette">
        <TweakColor
          label="Accent"
          value={tweaks.accent}
          onChange={(v) => setTweak('accent', v)}
          options={['#720094', '#00287F', '#FFFFFF', '#000000']}
        />
      </TweakSection>

      <TweakSection label="Display type">
        <TweakRadio
          label="Display font"
          value={tweaks.displayFont}
          onChange={(v) => setTweak('displayFont', v)}
          options={[
            { value: 'Barlow', label: 'Barlow' },
            { value: 'Libre Baskerville', label: 'Baskerville' },
            { value: 'JetBrains Mono', label: 'Mono' },
          ]}
        />
      </TweakSection>

      <TweakSection label="Surface effects">
        <TweakToggle
          label="Film grain"
          value={tweaks.showGrain}
          onChange={(v) => setTweak('showGrain', v)}
        />
        <TweakToggle
          label="Motion / animations"
          value={tweaks.showMotion}
          onChange={(v) => setTweak('showMotion', v)}
        />
      </TweakSection>
    </TweaksPanel>
  );
};

// Mount
const root = document.getElementById('root');
const reactRoot = ReactDOM.createRoot(root);
// Hydrate durable state from the project sidecar before first paint, so edits
// made earlier (or on another device / after a cache clear) are present.
(window.PPStore ? window.PPStore.hydrate() : Promise.resolve())
  .then(() => reactRoot.render(<App/>));

</script>
</body>
</html>
