  <style>
    :root {
      /* Brand palette — STRICT. Per Puscas Productions Brand Guidelines:
         only these four colors. Any tint/shade below is white/black mixed
         with one of the brand hues — never a new hue. */
      --black: #000000;
      --white: #FFFFFF;
      --purple: #720094;
      --blue: #00287F;

      /* Surfaces */
      --ink: #000000;
      --ink-2: #0A0410;        /* purple-tinted near-black */
      --ink-3: #050514;        /* blue-tinted near-black */
      --line: rgba(255,255,255,0.10);
      --line-2: rgba(255,255,255,0.20);

      /* Text — pure white system */
      --paper: #FFFFFF;
      --paper-dim: rgba(255,255,255,0.75);
      --fog: rgba(255,255,255,0.58);
      --mute: rgba(255,255,255,0.42);
      --hi: #FFFFFF;

      /* Purple — brand canonical + lighter mix for on-dark legibility
         (white blended with #720094, NOT a new hue) */
      --violet: #720094;       /* canonical */
      --violet-2: #4A005F;     /* darker for layered fills */
      --violet-3: #7C00A2;     /* lifted brand purple — per guidelines */
      --violet-glow: rgba(114, 0, 148, 0.55);
      --violet-soft: rgba(114, 0, 148, 0.16);

      /* Blue — brand canonical + lighter mix */
      --blueb: #00287F;        /* canonical */
      --blueb-2: #001A55;      /* darker */
      --blueb-3: #8090BF;      /* lighter — white + blue, on-hue */
      --blueb-glow: rgba(0, 40, 127, 0.55);
      --blueb-soft: rgba(0, 40, 127, 0.18);

      /* The signature brand gradient: purple → blue */
      --grad-brand: linear-gradient(135deg, #720094 0%, #00287F 100%);
      --grad-brand-soft: linear-gradient(135deg, rgba(114,0,148,0.22) 0%, rgba(0,40,127,0.22) 100%);
      /* Reverse for variety, still brand-only */
      --grad-brand-rev: linear-gradient(135deg, #00287F 0%, #720094 100%);

      --accent: var(--violet);
      --bg: var(--ink);

      --maxw: 1440px;
      --pad: clamp(16px, 4vw, 64px);

      /* Brand typography */
      --serif: "Libre Baskerville", "Times New Roman", serif;
      --display: "Barlow", "Helvetica Neue", system-ui, sans-serif;
      --sans: "Poppins", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { background: var(--bg); overflow-x: hidden; }
    body {
      font-family: var(--sans);
      color: var(--hi);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      letter-spacing: 0;
      font-weight: 300;
    }

    h1, h2, h3, h4 { margin: 0; font-weight: 500; letter-spacing: -0.02em; }
    p { margin: 0; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
    img { display: block; max-width: 100%; }

    /* Display — Barlow per brand guide (titles). Italic emphasis stays Barlow,
       white — Libre Baskerville is reserved for the logo/wordmark only. */
    .display { font-family: var(--display); font-weight: 600; letter-spacing: -0.02em; line-height: 1.02; }
    .display em { font-style: italic; font-weight: 600; color: var(--hi); letter-spacing: -0.02em; font-family: var(--display); }
    /* Logo wordmark only */
    .serif { font-family: var(--serif); font-weight: 400; letter-spacing: -0.005em; line-height: 1.1; text-transform: none; }
    .serif em { font-style: italic; }
    .mono { font-family: var(--mono); font-weight: 400; letter-spacing: 0; }
    .eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--mute);
    }

    /* Layout */
    .shell { min-height: 100vh; position: relative; }
    .wrap { max-width: var(--maxw); margin: 0 auto; padding-left: var(--pad); padding-right: var(--pad); }

    /* Grain texture */
    .grain::before {
      content: "";
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 100;
      opacity: 0.06;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScxNjAnIGhlaWdodD0nMTYwJz48ZmlsdGVyIGlkPSduJz48ZmVUdXJidWxlbmNlIHR5cGU9J2ZyYWN0YWxOb2lzZScgYmFzZUZyZXF1ZW5jeT0nMC45JyBudW1PY3RhdmVzPScyJyBzZWVkPSczJy8+PC9maWx0ZXI+PHJlY3Qgd2lkdGg9JzEwMCUnIGhlaWdodD0nMTAwJScgZmlsdGVyPSd1cmwoI24pJy8+PC9zdmc+");
    }

    /* Scrollbar tweak */
    ::selection { background: var(--violet); color: white; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.22); }

    /* Loading splash / intro cover — a static, plain-HTML black layer that
       exists from the first parsed byte and sits above ALL app chrome, so no
       frame of the UI (nav, menu, layout) can ever flash before the intro.
       Removed by the intro overlay once it is mounted and opaque. */
    html { background: #000; }
    .splash {
      position: fixed; inset: 0;
      background: #000;
      display: grid; place-items: center;
      z-index: 2000;
    }
    .splash .pulse {
      width: 60px; height: 60px; border-radius: 50%;
      background: radial-gradient(circle, var(--violet) 0%, transparent 70%);
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.6); opacity: 0.4; }
      50% { transform: scale(1.2); opacity: 1; }
    }

    /* While the intro is playing, the app shell is fully invisible — only the
       intro overlay (and the static cover before it) can ever be on screen.
       No frame of nav/menu/layout can flash on any device. */
    body.intro-wait:not(.intro-done) .shell { visibility: hidden; }
    body.intro-wait:not(.intro-done) .shell .intro-overlay { visibility: visible; }

    /* Reveal-on-scroll — elements fade/rise in the first time they appear.
       Base state is visible; animation only under no-preference. */
    @media (prefers-reduced-motion: no-preference) {
      body:not(.no-motion) .reveal {
        opacity: 0;
        transform: translateY(26px);
        transition: opacity .7s cubic-bezier(.22,1,.36,1), transform .7s cubic-bezier(.22,1,.36,1);
      }
      body:not(.no-motion) .reveal.from-left { transform: translateX(-72px); }
      body:not(.no-motion) .reveal.from-right { transform: translateX(72px); }
      body:not(.no-motion) .reveal.rv-in {
        opacity: 1;
        transform: none;
      }
    }
    /* Comfortable tap targets on touch devices (44px minimum) */
    @media (hover: none) {
      .f-link, .eyebrow a, .sect-link { min-height: 44px; display: inline-flex; align-items: center; }
    }

    @media print {
      .reveal { opacity: 1 !important; transform: none !important; }
    }

    /* Empty media slots never show on the public (read-only) site — visitors
       should never see "drop an image" placeholders or template chrome. */
    image-slot:not([data-filled]):not([data-editable]) { visibility: hidden; }

    /* Soft page transition on client-side route change */
    @media (prefers-reduced-motion: no-preference) {
      body:not(.no-motion) .shell.page-enter > main,
      body:not(.no-motion) .shell.page-enter > div:not([class]) {
        animation: page-in .6s cubic-bezier(.22,1,.36,1) both;
      }
    }
    @keyframes page-in {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: none; }
    }

    /* Nav logo + wordmark are always rendered — the intro overlay is fully
       self-contained and simply fades out over the finished page. */
    .nav-logo-real { opacity: 1; }
    .nav-wordmark { opacity: 1; }

    /* Nav + footer link hover — brand purple highlight */
    .nav-pill:not(.nav-active):hover {
      background: rgba(114,0,148,0.45) !important;
      color: #fff !important;
    }

    /* ── Responsive nav ── */
    /* Tablet: drop the "Open to roles" badge, tighten pills + nav padding */
    @media (max-width: 1024px) {
      nav { padding: 16px var(--pad) !important; }
      .nav-badge { display: none !important; }
      .nav-pill { padding: 9px 16px !important; font-size: 14px !important; }
    }
    /* Small tablet / large phone: hide wordmark, shrink pills further */
    @media (max-width: 760px) {
      .nav-wordmark { display: none !important; }
      .nav-pill { padding: 8px 13px !important; font-size: 13px !important; }
      .nav-pills { gap: 2px !important; padding: 4px !important; }
    }
    /* Phone: tighten the pills so all 5 items (incl. Contact) fit cleanly
       without clipping; keep scroll only as a fallback for very narrow screens */
    @media (max-width: 480px) {
      nav > div { gap: 8px !important; }
      .nav-pills {
        overflow-x: auto; -webkit-overflow-scrolling: touch;
        flex-wrap: nowrap; max-width: calc(100vw - 84px);
        scrollbar-width: none;
      }
      .nav-pills::-webkit-scrollbar { display: none; }
      .nav-pill { white-space: nowrap; flex: 0 0 auto;
        padding: 8px 10px !important; font-size: 12px !important;
        letter-spacing: 0 !important; }
    }
    .f-link { transition: color .2s ease, transform .2s ease; }
    .f-link:hover { color: #7C00A2 !important; transform: translateX(4px); }

    /* Client rows — name shifts to brand purple tint on hover */
    .client-name { transition: color .25s ease, transform .25s ease; }
    .client-row:hover .client-name { color: var(--violet-3); transform: translateX(4px); }

    /* Hero entrance — smooth, staggered rise in the brand's calm style */
    @keyframes hero-rise {
      0% { opacity: 0; transform: translateY(26px); filter: blur(8px); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    .hero-enter > * {
      opacity: 0;
      animation: hero-rise 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .hero-enter > *:nth-child(1) { animation-delay: 0.15s; }
    .hero-enter > *:nth-child(2) { animation-delay: 0.32s; }
    .hero-enter > *:nth-child(3) { animation-delay: 0.49s; }
    .hero-enter > *:nth-child(4) { animation-delay: 0.66s; }
    @media (prefers-reduced-motion: reduce) {
      .hero-enter > * { opacity: 1; animation: none; filter: none; transform: none; }
    }
  </style>
</head>

  <script>
// @ds-adherence-ignore -- omelette starter scaffold (raw elements/hex/px by design)
/* BEGIN USAGE */
/**
 * <image-slot> — user-fillable image placeholder.
 *
 * Drop this into a deck, mockup, or page wherever you want the user to
 * supply an image. You control the slot's shape and size; the user fills it
 * by dragging an image file onto it (or clicking to browse). The dropped
 * image persists across reloads via a .image-slots.state.json sidecar —
 * same read-via-fetch / write-via-window.omelette pattern as
 * design_canvas.jsx, so the filled slot shows on share links, downloaded
 * zips, and PPTX export. Outside the omelette runtime the slot is read-only.
 *
 * The host bridge only allows sidecar writes at the project root, so the
 * HTML that uses this component is assumed to live at the project root too
 * (same constraint as design_canvas.jsx).
 *
 * Attributes:
 *   id           Persistence key. REQUIRED for the drop to survive reload —
 *                every slot on the page needs a distinct id.
 *   shape        'rect' | 'rounded' | 'circle' | 'pill'   (default 'rounded')
 *                'circle' applies 50% border-radius; on a non-square slot
 *                that's an ellipse — set equal width and height for a true
 *                circle.
 *   radius       Corner radius in px for 'rounded'.       (default 12)
 *   mask         Any CSS clip-path value. Overrides `shape` — use this for
 *                hexagons, blobs, arbitrary polygons.
 *   fit          object-fit: cover | contain | fill.       (default 'cover')
 *                With cover (the default) double-clicking the filled slot
 *                enters a reframe mode: the whole image spills past the mask
 *                (translucent outside, opaque inside), drag to reposition,
 *                corner-drag to scale. The crop persists alongside the image
 *                in the sidecar. contain/fill stay static.
 *   position     object-position for fit=contain|fill.     (default '50% 50%')
 *   placeholder  Empty-state caption.                      (default 'Drop an image')
 *   src          Optional initial/fallback image URL. A user drop overrides
 *                it; clearing the drop reveals src again.
 *
 * Size and layout come from ordinary CSS on the element — width/height
 * inline or from a parent grid — so it composes with any layout.
 *
 * Usage:
 *   <image-slot id="hero"   style="width:800px;height:450px" shape="rounded" radius="20"
 *               placeholder="Drop a hero image"></image-slot>
 *   <image-slot id="avatar" style="width:120px;height:120px" shape="circle"></image-slot>
 *   <image-slot id="kite"   style="width:300px;height:300px"
 *               mask="polygon(50% 0, 100% 50%, 50% 100%, 0 50%)"></image-slot>
 */
/* END USAGE */

(() => {
  // Per-slot sidecar files. The host caps each *.state.json write at ~1MB,
  // so a single shared file forced every image down to a tiny resolution to
  // fit them all under one budget. Sharding one file PER SLOT gives each
  // image its own ~1MB budget — so each can be high-resolution, and the
  // total number of images is effectively unbounded.
  const LEGACY_FILE = '.image-slots.state.json';      // pre-shard combined file (read-only, for back-compat)
  const fileFor = (id) => '.islot-' + String(id).replace(/[^a-z0-9_-]/gi, '_') + '.state.json';
  // Longest side capped at 1920px at WebP q0.86 — sharp on every screen,
  // and comfortably under the per-file cap.
  const MAX_DIM = 1920;
  // Raster formats only. SVG is excluded (can carry script; createImageBitmap
  // on SVG blobs is inconsistent). GIF is excluded because the canvas
  // re-encode keeps only the first frame, so an animated GIF would silently
  // go still — better to reject than surprise.
  const ACCEPT = ['image/png', 'image/jpeg', 'image/webp', 'image/avif'];

  // ── Per-slot sidecar store ──────────────────────────────────────────────
  // Each <image-slot id="X"> reads/writes its own .islot-X.state.json. Reads
  // via fetch() so viewing works anywhere the HTML + sidecars are served
  // together; writes go through window.omelette.writeFile (host allowlists
  // *.state.json basenames only).
  const subs = new Set();
  let slots = {};
  // ids explicitly cleared before their fetch resolved — so the merge can't
  // tell "never set" from "just deleted" and resurrect a stale value.
  const tombstones = new Set();
  const loadedIds = new Set();
  const loadingIds = new Map();

  // Legacy combined sidecar, fetched once and used only to seed slots that
  // don't yet have a per-slot file (images saved before sharding existed).
  let legacyP = null;
  function loadLegacy() {
    if (legacyP) return legacyP;
    legacyP = fetch(LEGACY_FILE).then((r) => (r.ok ? r.json() : null)).catch(() => null);
    return legacyP;
  }

  function loadSlot(id) {
    if (!id) return Promise.resolve();
    if (loadingIds.has(id)) return loadingIds.get(id);
    // Baked static build: a generated bootstrap may embed slot state directly
    // (window.__PP_EMBED__.islots) so the published file needs no fetch.
    const embAll = window.__PP_EMBED__ && window.__PP_EMBED__.islots;
    const embHas = embAll && Object.prototype.hasOwnProperty.call(embAll, id);
    const readSrc = embHas
      ? Promise.resolve(embAll[id])
      : fetch(fileFor(id)).then((r) => (r.ok ? r.json() : null)).catch(() => null);
    const p = readSrc
      .catch(() => null)
      .then((disk) => {
        if (disk && disk.cleared) return { __cleared: true };
        if (disk != null) return disk;
        // No per-slot file yet — fall back to the legacy combined file.
        return loadLegacy().then((lg) => (lg && lg[id] != null ? lg[id] : null));
      })
      .catch(() => null)
      .then((diskVal) => {
        loadedIds.add(id);
        if (diskVal && diskVal.__cleared) { /* deliberately empty */ }
        else if (!tombstones.has(id)) {
          const mem = slots[id];
          // In-memory change (a drop/clear that raced ahead) wins over disk;
          // a framing-only in-memory entry inherits the stored image bytes.
          if (mem && mem.u) { /* keep memory */ }
          else if (mem && !mem.u && diskVal) {
            mem.u = typeof diskVal === 'string' ? diskVal : diskVal.u;
          } else if (diskVal) {
            slots[id] = typeof diskVal === 'string' ? { u: diskVal, s: 1, x: 0, y: 0 } : diskVal;
          }
        }
        subs.forEach((fn) => fn());
      });
    loadingIds.set(id, p);
    return p;
  }

  // Per-id write serialization: a save requested while one is in flight for
  // the same id just marks it dirty and re-fires on completion.
  const savingIds = new Set();
  const dirtyIds = new Set();
  function saveSlot(id) {
    if (!id) return;
    const w = window.omelette && window.omelette.writeFile;
    if (!w || (window.__PP_EMBED__ && window.__PP_EMBED__.readonly)) return;
    if (savingIds.has(id)) { dirtyIds.add(id); return; }
    savingIds.add(id);
    const val = slots[id];
    // A cleared slot writes an explicit tombstone marker so load() won't
    // resurrect it from the legacy combined file.
    const payload = val ? JSON.stringify(val) : JSON.stringify({ cleared: true });
    Promise.resolve(w(fileFor(id), payload))
      .catch(() => {})
      .then(() => { savingIds.delete(id); if (dirtyIds.has(id)) { dirtyIds.delete(id); saveSlot(id); } });
  }

  const S_MAX = 5;
  const clampS = (s) => Math.max(1, Math.min(S_MAX, s));

  // Normalize a stored slot value. Pre-reframe sidecars stored a bare
  // data-URL string; newer ones store {u, s, x, y}. Either shape is valid.
  function getSlot(id) {
    const v = slots[id];
    if (!v) return null;
    return typeof v === 'string' ? { u: v, s: 1, x: 0, y: 0 } : v;
  }

  function setSlot(id, val) {
    if (!id) return;
    if (val) { slots[id] = val; tombstones.delete(id); }
    else { delete slots[id]; tombstones.add(id); }
    subs.forEach((fn) => fn());
    // A drop is rare + high-value — write immediately so nav-away can't lose
    // it. Gate on the initial read so we don't overwrite a file we haven't
    // merged yet; loadSlot's merge keeps this change once the read lands.
    if (loadedIds.has(id)) saveSlot(id); else loadSlot(id).then(() => saveSlot(id));
  }

  // ── Image downscale ─────────────────────────────────────────────────────
  // Encode through a canvas so the sidecar carries resized bytes, not the
  // raw upload. Longest side is capped at 2× the slot's rendered width
  // (retina) and at MAX_DIM. WebP keeps alpha and is ~10× smaller than PNG
  // for photos, so there's no need for per-image format picking.
  async function toDataUrl(file, targetW) {
    const bitmap = await createImageBitmap(file);
    try {
      // Floor of 1280: drops often land on small proxy boxes (e.g. a video's
      // end-card adder) whose rendered width is tiny — encoding to 2× that
      // would bake in a blurry thumbnail that later shows full-bleed.
      const cap = Math.min(MAX_DIM, Math.max(1280, Math.round(targetW * 2) || MAX_DIM));
      const scale = Math.min(1, cap / Math.max(bitmap.width, bitmap.height));
      const w = Math.max(1, Math.round(bitmap.width * scale));
      const h = Math.max(1, Math.round(bitmap.height * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
      return canvas.toDataURL('image/webp', 0.86);
    } finally {
      bitmap.close && bitmap.close();
    }
  }

  // ── Custom element ──────────────────────────────────────────────────────
  const stylesheet =
    ':host{display:inline-block;position:relative;vertical-align:top;' +
    '  font:13px/1.3 system-ui,-apple-system,sans-serif;color:rgba(0,0,0,.55);width:240px;height:160px}' +
    '.frame{position:absolute;inset:0;overflow:hidden;background:rgba(0,0,0,.04)}' +
    // .frame img (clipped) and .spill (unclipped ghost + handles) share the
    // same left/top/width/height in frame-%, computed by _applyView(), so the
    // inside-mask crop and the outside-mask spill stay pixel-aligned.
    '.frame img{position:absolute;max-width:none;transform:translate(-50%,-50%);' +
    '  -webkit-user-drag:none;user-select:none;touch-action:none}' +
    // Reframe mode (double-click): the full image spills past the mask. The
    // spill layer is sized to the IMAGE bounds so its corners are where the
    // resize handles belong. The ghost <img> inside is translucent; the real
    // clipped <img> underneath shows the opaque in-mask crop.
    '.spill{position:absolute;transform:translate(-50%,-50%);display:none;z-index:1;' +
    '  cursor:grab;touch-action:none}' +
    ':host([data-panning]) .spill{cursor:grabbing}' +
    '.spill .ghost{position:absolute;inset:0;width:100%;height:100%;opacity:.35;' +
    '  pointer-events:none;-webkit-user-drag:none;user-select:none;' +
    '  box-shadow:0 0 0 1px rgba(0,0,0,.2),0 12px 32px rgba(0,0,0,.2)}' +
    '.spill .handle{position:absolute;width:12px;height:12px;border-radius:50%;' +
    '  background:#fff;box-shadow:0 0 0 1.5px #c96442,0 1px 3px rgba(0,0,0,.3);' +
    '  transform:translate(-50%,-50%)}' +
    '.spill .handle[data-c=nw]{left:0;top:0;cursor:nwse-resize}' +
    '.spill .handle[data-c=ne]{left:100%;top:0;cursor:nesw-resize}' +
    '.spill .handle[data-c=sw]{left:0;top:100%;cursor:nesw-resize}' +
    '.spill .handle[data-c=se]{left:100%;top:100%;cursor:nwse-resize}' +
    ':host([data-reframe]){z-index:10}' +
    ':host([data-reframe]) .spill{display:block}' +
    ':host([data-reframe]) .frame{box-shadow:0 0 0 2px #c96442}' +
    '.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;' +
    '  justify-content:center;gap:6px;text-align:center;padding:12px;box-sizing:border-box;' +
    '  cursor:pointer;user-select:none}' +
    '.empty svg{opacity:.45}' +
    '.empty .cap{max-width:90%;font-weight:500;letter-spacing:.01em}' +
    '.empty .sub{font-size:11px}' +
    '.empty .sub u{text-underline-offset:2px;text-decoration-color:rgba(0,0,0,.25)}' +
    '.empty:hover .sub u{color:rgba(0,0,0,.75);text-decoration-color:currentColor}' +
    ':host([data-over]) .frame{outline:2px solid #c96442;outline-offset:-2px;' +
    '  background:rgba(201,100,66,.10)}' +
    '.ring{position:absolute;inset:0;pointer-events:none;border:1.5px dashed rgba(0,0,0,.25);' +
    '  transition:border-color .12s}' +
    ':host([data-over]) .ring{border-color:#c96442}' +
    ':host([data-filled]) .ring{display:none}' +
    // Controls sit BELOW the mask (top:100%), absolutely positioned so the
    // author-declared slot height is unaffected. The gap is padding, not a
    // top offset, so the hover target stays contiguous with the frame.
    '.ctl{position:absolute;top:8px;right:8px;' +
    '  display:flex;gap:6px;opacity:0;pointer-events:none;transition:opacity .12s;z-index:3;' +
    '  white-space:nowrap}' +
    ':host([data-filled][data-editable]:hover) .ctl,:host([data-reframe]) .ctl' +
    '  {opacity:1;pointer-events:auto}' +
    '.ctl button{appearance:none;border:0;border-radius:6px;padding:6px 11px;cursor:pointer;' +
    '  background:rgba(0,0,0,.72);color:#fff;font:11px/1 system-ui,-apple-system,sans-serif;' +
    '  box-shadow:0 2px 8px rgba(0,0,0,.35);backdrop-filter:blur(6px)}' +
    '.ctl button:hover{background:rgba(0,0,0,.8)}' +
    '.err{position:absolute;left:8px;bottom:8px;right:8px;color:#b3261e;font-size:11px;' +
    '  background:rgba(255,255,255,.85);padding:4px 6px;border-radius:5px;pointer-events:none}';

  const icon =
    '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
    '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>' +
    '<path d="m21 15-5-5L5 21"/></svg>';

  class ImageSlot extends HTMLElement {
    static get observedAttributes() {
      return ['shape', 'radius', 'mask', 'fit', 'position', 'placeholder', 'src', 'id'];
    }

    constructor() {
      super();
      const root = this.attachShadow({ mode: 'open' });
      // .spill and .ctl sit OUTSIDE .frame so overflow:hidden + border-radius
      // on the frame (circle, pill, rounded) can't clip them.
      root.innerHTML =
        '<style>' + stylesheet + '</style>' +
        '<div class="frame" part="frame">' +
        '  <img part="image" alt="" draggable="false" loading="lazy" decoding="async" style="display:none">' +
        '  <div class="empty" part="empty">' + icon +
        '    <div class="cap"></div>' +
        '    <div class="sub">or <u>browse files</u></div></div>' +
        '  <div class="ring" part="ring"></div>' +
        '</div>' +
        '<div class="spill">' +
        '  <img class="ghost" alt="" draggable="false">' +
        '  <div class="handle" data-c="nw"></div><div class="handle" data-c="ne"></div>' +
        '  <div class="handle" data-c="sw"></div><div class="handle" data-c="se"></div>' +
        '</div>' +
        '<div class="ctl"><button data-act="adjust" title="Adjust framing — drag to reposition, corners or scroll to zoom">Adjust</button>' +
        '  <button data-act="replace" title="Replace image">Replace</button>' +
        '  <button data-act="clear" title="Remove image">Remove</button></div>' +
        '<input type="file" accept="' + ACCEPT.join(',') + '" hidden>';
      this._frame = root.querySelector('.frame');
      this._ring = root.querySelector('.ring');
      this._img = root.querySelector('.frame img');
      this._empty = root.querySelector('.empty');
      this._cap = root.querySelector('.cap');
      this._sub = root.querySelector('.sub');
      this._spill = root.querySelector('.spill');
      this._ghost = root.querySelector('.ghost');
      this._err = null;
      this._input = root.querySelector('input');
      this._depth = 0;
      this._gen = 0;
      this._view = { s: 1, x: 0, y: 0 };
      this._subFn = () => this._render();
      // Shadow-DOM listeners live with the shadow DOM — bound once here so
      // disconnect/reconnect (e.g. React remount) doesn't stack handlers.
      this._empty.addEventListener('click', () => this._input.click());
      root.addEventListener('click', (e) => {
        const act = e.target && e.target.getAttribute && e.target.getAttribute('data-act');
        if (act === 'adjust') {
          if (this.hasAttribute('data-reframe')) this._exitReframe(true);
          else if (this._reframes()) this._enterReframe();
        }
        if (act === 'replace') { this._exitReframe(true); this._input.click(); }
        if (act === 'clear') {
          this._exitReframe(false);
          this._gen++;
          this._local = null;
          if (this.id) setSlot(this.id, null); else this._render();
        }
      });
      this._input.addEventListener('change', () => {
        const f = this._input.files && this._input.files[0];
        if (f) this._ingest(f);
        this._input.value = '';
      });
      // naturalWidth/Height aren't known until load — re-apply so the cover
      // baseline is computed from real dimensions, not the 100%×100% fallback.
      this._img.addEventListener('load', () => this._applyView());
      // Gated on editable + fit=cover so share links and contain/fill slots
      // stay static.
      this.addEventListener('dblclick', (e) => {
        if (!this.hasAttribute('data-editable') || !this._reframes()) return;
        e.preventDefault();
        if (this.hasAttribute('data-reframe')) this._exitReframe(true);
        else this._enterReframe();
      });
      // Pan + resize both originate on the spill layer. A handle pointerdown
      // drives an aspect-locked resize anchored at the opposite corner; any
      // other pointerdown on the spill pans. Offsets are frame-% so a
      // reframed slot survives responsive resize / PPTX export.
      this._spill.addEventListener('pointerdown', (e) => {
        if (e.button !== 0 || !this.hasAttribute('data-reframe')) return;
        e.preventDefault();
        e.stopPropagation();
        this._spill.setPointerCapture(e.pointerId);
        const rect = this.getBoundingClientRect();
        const fw = rect.width || 1, fh = rect.height || 1;
        const corner = e.target.getAttribute && e.target.getAttribute('data-c');
        let move;
        if (corner) {
          // Resize about the OPPOSITE corner. Viewport-px throughout (rect
          // fw/fh, not clientWidth) so the math survives a transform:scale()
          // ancestor — deck_stage renders slides scaled-to-fit.
          const iw = this._img.naturalWidth || 1, ih = this._img.naturalHeight || 1;
          const base = Math.max(fw / iw, fh / ih);
          const sx = corner.includes('e') ? 1 : -1;
          const sy = corner.includes('s') ? 1 : -1;
          const s0 = this._view.s;
          const w0 = iw * base * s0, h0 = ih * base * s0;
          const cx0 = (50 + this._view.x) / 100 * fw;
          const cy0 = (50 + this._view.y) / 100 * fh;
          const ox = cx0 - sx * w0 / 2, oy = cy0 - sy * h0 / 2;
          const diag0 = Math.hypot(w0, h0);
          const ux = sx * w0 / diag0, uy = sy * h0 / diag0;
          move = (ev) => {
            const proj = (ev.clientX - rect.left - ox) * ux +
                         (ev.clientY - rect.top - oy) * uy;
            const s = clampS(s0 * proj / diag0);
            const d = diag0 * s / s0;
            this._view.s = s;
            this._view.x = (ox + ux * d / 2) / fw * 100 - 50;
            this._view.y = (oy + uy * d / 2) / fh * 100 - 50;
            this._clampView();
            this._applyView();
          };
        } else {
          this.setAttribute('data-panning', '');
          const start = { px: e.clientX, py: e.clientY, x: this._view.x, y: this._view.y };
          move = (ev) => {
            this._view.x = start.x + (ev.clientX - start.px) / fw * 100;
            this._view.y = start.y + (ev.clientY - start.py) / fh * 100;
            this._clampView();
            this._applyView();
          };
        }
        const up = () => {
          try { this._spill.releasePointerCapture(e.pointerId); } catch {}
          this._spill.removeEventListener('pointermove', move);
          this._spill.removeEventListener('pointerup', up);
          this._spill.removeEventListener('pointercancel', up);
          this.removeAttribute('data-panning');
          this._dragUp = null;
        };
        // Stashed so _exitReframe (Escape / outside-click mid-drag) can
        // tear the capture + listeners down synchronously.
        this._dragUp = up;
        this._spill.addEventListener('pointermove', move);
        this._spill.addEventListener('pointerup', up);
        this._spill.addEventListener('pointercancel', up);
      });
      // Wheel zoom stays available inside reframe mode as a trackpad nicety —
      // zooms toward the cursor (offset' = cursor·(1-k) + offset·k).
      this.addEventListener('wheel', (e) => {
        if (!this.hasAttribute('data-reframe')) return;
        e.preventDefault();
        const r = this.getBoundingClientRect();
        const cx = (e.clientX - r.left) / r.width * 100 - 50;
        const cy = (e.clientY - r.top) / r.height * 100 - 50;
        const prev = this._view.s;
        const next = clampS(prev * Math.pow(1.0015, -e.deltaY));
        if (next === prev) return;
        const k = next / prev;
        this._view.s = next;
        this._view.x = cx * (1 - k) + this._view.x * k;
        this._view.y = cy * (1 - k) + this._view.y * k;
        this._clampView();
        this._applyView();
      }, { passive: false });
    }

    connectedCallback() {
      // Warn once per page — an id-less slot works for the session but
      // cannot persist, and two id-less slots would share nothing.
      if (!this.id && !ImageSlot._warned) {
        ImageSlot._warned = true;
        console.warn('<image-slot> without an id will not persist its dropped image.');
      }
      this.addEventListener('dragenter', this);
      this.addEventListener('dragover', this);
      this.addEventListener('dragleave', this);
      this.addEventListener('drop', this);
      subs.add(this._subFn);
      // width%/height% in _applyView encode the frame aspect at call time —
      // a host resize (responsive grid, pane divider) would stretch the
      // image until the next _render. Re-render on size change: _render()
      // re-seeds _view from stored before clamp/apply, so a shrink→grow
      // cycle round-trips instead of ratcheting x/y toward the narrower
      // frame's clamp range.
      this._ro = new ResizeObserver(() => this._render());
      this._ro.observe(this);
      if (this.id) loadSlot(this.id);
      this._render();
    }

    disconnectedCallback() {
      subs.delete(this._subFn);
      this.removeEventListener('dragenter', this);
      this.removeEventListener('dragover', this);
      this.removeEventListener('dragleave', this);
      this.removeEventListener('drop', this);
      if (this._ro) { this._ro.disconnect(); this._ro = null; }
      this._exitReframe(false);
    }

    // Hide Adjust for contain/fill slots (reframe is cover-only) and relabel
    // it "Done" while reframe mode is active.
    _syncAdjustBtn() {
      const b = this.shadowRoot && this.shadowRoot.querySelector('[data-act=adjust]');
      if (!b) return;
      b.style.display = this._reframes() ? '' : 'none';
      b.textContent = this.hasAttribute('data-reframe') ? 'Done' : 'Adjust';
    }

    _enterReframe() {
      if (this.hasAttribute('data-reframe')) return;
      this.setAttribute('data-reframe', '');
      this._syncAdjustBtn();
      this._applyView();
      // Close on click outside (the spill handler stopPropagation()s so
      // in-image drags don't reach this) and on Escape. Listeners are held
      // on the instance so _exitReframe / disconnectedCallback can detach
      // exactly what was attached.
      this._outside = (e) => {
        if (e.composedPath && e.composedPath().includes(this)) return;
        this._exitReframe(true);
      };
      this._esc = (e) => { if (e.key === 'Escape') this._exitReframe(true); };
      document.addEventListener('pointerdown', this._outside, true);
      document.addEventListener('keydown', this._esc, true);
    }

    _exitReframe(commit) {
      if (!this.hasAttribute('data-reframe')) return;
      if (this._dragUp) this._dragUp();
      this.removeAttribute('data-reframe');
      this.removeAttribute('data-panning');
      if (this._outside) document.removeEventListener('pointerdown', this._outside, true);
      if (this._esc) document.removeEventListener('keydown', this._esc, true);
      this._outside = this._esc = null;
      this._syncAdjustBtn();
      if (commit) this._commitView();
    }

    attributeChangedCallback() { if (this.shadowRoot) this._render(); }

    // handleEvent — one listener object for all four drag events keeps the
    // add/remove symmetric and the depth counter correct.
    handleEvent(e) {
      if (e.type === 'dragenter' || e.type === 'dragover') {
        // Without preventDefault the browser never fires 'drop'.
        e.preventDefault();
        e.stopPropagation();
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
        if (e.type === 'dragenter') this._depth++;
        this.setAttribute('data-over', '');
      } else if (e.type === 'dragleave') {
        // dragenter/leave fire for every descendant crossing — count depth
        // so hovering the icon inside the empty state doesn't flicker.
        if (--this._depth <= 0) { this._depth = 0; this.removeAttribute('data-over'); }
      } else if (e.type === 'drop') {
        e.preventDefault();
        e.stopPropagation();
        this._depth = 0;
        this.removeAttribute('data-over');
        const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (f) this._ingest(f);
      }
    }

    async _ingest(file) {
      this._setError(null);
      if (!file || ACCEPT.indexOf(file.type) < 0) {
        this._setError('Drop a PNG, JPEG, WebP, or AVIF image.');
        return;
      }
      // toDataUrl can take hundreds of ms on a large photo. A Clear or a
      // newer drop during that window would be clobbered when this await
      // resumes — bump + capture a generation so stale encodes bail.
      const gen = ++this._gen;
      try {
        const w = this.clientWidth || this.offsetWidth || MAX_DIM;
        const url = await toDataUrl(file, w);
        if (gen !== this._gen) return;
        // Only exit reframe once the new image is in hand — a rejected type
        // or decode failure leaves the in-progress crop untouched.
        this._exitReframe(false);
        const val = { u: url, s: 1, x: 0, y: 0 };
        setSlot(this.id || '', val);
        // Keep a session-local copy for id-less slots so the drop still
        // shows, even though it cannot persist.
        if (!this.id) { this._local = val; this._render(); }
      } catch (err) {
        if (gen !== this._gen) return;
        this._setError('Could not read that image.');
        console.warn('<image-slot> ingest failed:', err);
      }
    }

    _setError(msg) {
      if (this._err) { this._err.remove(); this._err = null; }
      if (!msg) return;
      const d = document.createElement('div');
      d.className = 'err'; d.textContent = msg;
      this.shadowRoot.appendChild(d);
      this._err = d;
      setTimeout(() => { if (this._err === d) { d.remove(); this._err = null; } }, 3000);
    }

    // Reframing (pan/resize) is only meaningful for fit=cover — contain/fill
    // keep the old object-fit path and double-click is a no-op.
    _reframes() {
      return this.hasAttribute('data-filled') &&
        (this.getAttribute('fit') || 'cover') === 'cover';
    }

    // Cover-baseline geometry, shared by clamp/apply/resize. Null until the
    // img has loaded (naturalWidth is 0 before that) or when the slot has no
    // layout box — ResizeObserver fires with a 0×0 rect under display:none,
    // and clamping against a degenerate 1×1 frame would silently pull the
    // stored pan toward zero.
    _geom() {
      const iw = this._img.naturalWidth, ih = this._img.naturalHeight;
      const fw = this.clientWidth, fh = this.clientHeight;
      if (!iw || !ih || !fw || !fh) return null;
      return { iw, ih, fw, fh, base: Math.max(fw / iw, fh / ih) };
    }

    _clampView() {
      // Pan range on each axis is half the overflow past the frame edge.
      const g = this._geom();
      if (!g) return;
      const mx = Math.max(0, (g.iw * g.base * this._view.s / g.fw - 1) * 50);
      const my = Math.max(0, (g.ih * g.base * this._view.s / g.fh - 1) * 50);
      this._view.x = Math.max(-mx, Math.min(mx, this._view.x));
      this._view.y = Math.max(-my, Math.min(my, this._view.y));
    }

    _applyView() {
      const g = this._geom();
      const fit = this.getAttribute('fit') || 'cover';
      if (fit !== 'cover' || !g) {
        // Non-cover, or dimensions not known yet (before img load).
        this._img.style.width = '100%';
        this._img.style.height = '100%';
        this._img.style.left = '50%';
        this._img.style.top = '50%';
        this._img.style.objectFit = fit;
        this._img.style.objectPosition = this.getAttribute('position') || '50% 50%';
        return;
      }
      // Cover baseline: img fills the frame on its tighter axis at s=1, so
      // pan works immediately on the overflowing axis without zooming first.
      // Width/height and left/top are all frame-% — depends only on the
      // frame aspect ratio, so a responsive resize keeps the same crop. The
      // spill layer mirrors the same box so its corners = image corners.
      const k = g.base * this._view.s;
      const w = (g.iw * k / g.fw * 100) + '%';
      const h = (g.ih * k / g.fh * 100) + '%';
      const l = (50 + this._view.x) + '%';
      const t = (50 + this._view.y) + '%';
      this._img.style.width = w; this._img.style.height = h;
      this._img.style.left = l; this._img.style.top = t;
      this._img.style.objectFit = '';
      this._spill.style.width = w; this._spill.style.height = h;
      this._spill.style.left = l; this._spill.style.top = t;
    }

    _commitView() {
      const v = { s: this._view.s, x: this._view.x, y: this._view.y };
      if (this._userUrl) v.u = this._userUrl;
      // Framing-only (no u) persists too so an author-src slot remembers its
      // crop; clearing the sidecar still falls through to src=.
      if (this.id) setSlot(this.id, v);
      else { this._local = v; }
    }

    _render() {
      this._syncAdjustBtn();
      // Shape / mask. Presets use border-radius so the dashed ring can
      // follow the rounded outline; clip-path is only applied for an
      // explicit `mask` (the ring is hidden there since a rectangle
      // dashed border chopped by an arbitrary polygon looks broken).
      const mask = this.getAttribute('mask');
      const shape = (this.getAttribute('shape') || 'rounded').toLowerCase();
      let radius = '';
      if (shape === 'circle') radius = '50%';
      else if (shape === 'pill') radius = '9999px';
      else if (shape === 'rounded') {
        const n = parseFloat(this.getAttribute('radius'));
        radius = (Number.isFinite(n) ? n : 12) + 'px';
      }
      this._frame.style.borderRadius = mask ? '' : radius;
      this._frame.style.clipPath = mask || '';
      this._ring.style.borderRadius = mask ? '' : radius;
      this._ring.style.display = mask ? 'none' : '';

      // Controls and reframe entry gate on this so share links stay read-only.
      const editable = !!(window.omelette && window.omelette.writeFile) && !(window.__PP_EMBED__ && window.__PP_EMBED__.readonly);
      this.toggleAttribute('data-editable', editable);
      this._sub.style.display = editable ? '' : 'none';

      // Content. The sidecar is also writable by the agent's write_file
      // tool, so its value isn't guaranteed canvas-originated — accept only
      // data:image/ URLs, or a same-origin path inside images/ with a raster
      // extension (how the published build ships its imagery as cacheable
      // files). Both forms can't carry script; anything else is discarded.
      let stored = this.id ? getSlot(this.id) : this._local;
      const okUrl = (u) => /^data:image\//i.test(u) ||
        /^images\/[A-Za-z0-9._-]+\.(webp|png|jpe?g|avif)$/i.test(u);
      if (stored && stored.u && !okUrl(stored.u)) stored = null;
      let srcAttr = this.getAttribute('src') || '';
      if (srcAttr && window.PPAsset) srcAttr = window.PPAsset(srcAttr);
      this._userUrl = (stored && stored.u) || null;
      const url = this._userUrl || srcAttr;
      // Don't clobber an in-flight reframe with a store-triggered re-render.
      if (!this.hasAttribute('data-reframe')) {
        this._view = {
          s: stored && Number.isFinite(stored.s) ? clampS(stored.s) : 1,
          x: stored && Number.isFinite(stored.x) ? stored.x : 0,
          y: stored && Number.isFinite(stored.y) ? stored.y : 0,
        };
      }
      this._cap.textContent = this.getAttribute('placeholder') || 'Drop an image';
      // Toggle via style.display — the [hidden] attribute alone loses to
      // the display:flex / display:block rules in the stylesheet above.
      if (url) {
        if (this._img.getAttribute('src') !== url) {
          this._img.src = url;
          this._ghost.src = url;
        }
        this._img.style.display = 'block';
        this._empty.style.display = 'none';
        this.setAttribute('data-filled', '');
        this._clampView();
        this._applyView();
      } else {
        this._img.style.display = 'none';
        this._img.removeAttribute('src');
        this._ghost.removeAttribute('src');
        this._empty.style.display = 'flex';
        this.removeAttribute('data-filled');

    customElements.define('image-slot', ImageSlot);

// <video-slot> — user-fillable video placeholder.
// Drop an .mp4/.webm/.mov onto it (or click to browse). The file persists
// in IndexedDB under the slot's id, so it survives reloads in this browser.
// Attributes:
//   id          persistence key (required, unique per slot)
//   placeholder empty-state caption (default "Drop a video")
//   controls    show native video controls when filled
//   loop        loop playback (default: on when no controls)
(function () {
  const DB = 'pp-video-slots';
  function idb() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(DB, 1);
      r.onupgradeneeded = () => r.result.createObjectStore('v');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  async function get(key) {
    const db = await idb();
    return new Promise((res) => {
      const t = db.transaction('v').objectStore('v').get(key);
      t.onsuccess = () => res(t.result || null);
      t.onerror = () => res(null);
    });
  }
  async function set(key, val) {
    const db = await idb();
    return new Promise((res) => {
      const t = db.transaction('v', 'readwrite');
      if (val === null) t.objectStore('v').delete(key);
      else t.objectStore('v').put(val, key);
      t.oncomplete = () => res();
    });
  }

  class VideoSlot extends HTMLElement {
    connectedCallback() {
      if (this._init) return;
      this._init = true;
      const sh = this.attachShadow({ mode: 'open' });
      sh.innerHTML = `
        <style>
          :host { display: block; position: relative; overflow: hidden; }
          .zone {
            position: absolute; inset: 0;
            display: grid; place-items: center;
            cursor: pointer;
            transition: background .2s ease;
          }
          :host([hint-align="top"]) .zone {
            place-items: start end;
            padding: clamp(84px, 11vh, 130px) 24px 0 0;

          .zone.drag { background: rgba(114,0,148,0.18); }

            font-family: "JetBrains Mono", monospace;
            font-size: 11px; letter-spacing: 0.16em;
            color: rgba(255,255,255,0.55);
            padding: 8px 14px;
            border: 1px dashed rgba(255,255,255,0.25);
            border-radius: 99px;
            background: rgba(0,0,0,0.35);
            text-transform: uppercase;
            white-space: nowrap;
          }
          .zone.drag .hint { border-color: #720094; color: white; }
          video {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
            background: black;
          }
          :host([fit="contain"]) video { object-fit: contain; }
          .clear {
            position: absolute; top: 10px; right: 10px;
            width: 28px; height: 28px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(0,0,0,0.55);
            color: white;
            font-size: 13px; line-height: 1;
            cursor: pointer;
            display: none;
            place-items: center;
            z-index: 3;

          :host(:hover) .clear.on { display: grid; }
          input { display: none; }
        </style>
        <div class="zone"><span class="hint"></span></div>
        <button class="clear" title="Remove video">✕</button>
        <input type="file" accept="video/*">

      this._zone = sh.querySelector('.zone');
      this._hint = sh.querySelector('.hint');
      this._clear = sh.querySelector('.clear');
      this._input = sh.querySelector('input');
      this._hint.textContent = this.getAttribute('placeholder') || 'Drop a video';

      this._zone.addEventListener('click', () => this._input.click());
      this._input.addEventListener('change', () => {
        if (this._input.files[0]) this._save(this._input.files[0]);
      });
      this._zone.addEventListener('dragover', (e) => { e.preventDefault(); this._zone.classList.add('drag'); });
      this._zone.addEventListener('dragleave', () => this._zone.classList.remove('drag'));
      this._zone.addEventListener('drop', (e) => {
        e.preventDefault();
        this._zone.classList.remove('drag');
        const f = [...(e.dataTransfer.files || [])].find((x) => x.type.startsWith('video/'));
        if (f) this._save(f);

      this._clear.addEventListener('click', async (e) => {
        e.stopPropagation();
        await set(this._key(), null);
        this._showEmpty();
      });
      this._restore();
    }
    _key() { return 'vs-' + (this.getAttribute('id') || 'default'); }
    async _restore() {
      const blob = await get(this._key());
      if (blob) this._showVideo(blob);
    }
    async _save(file) {
      await set(this._key(), file);
      this._showVideo(file);
    }
    _showVideo(blob) {
      if (this._video) this._video.remove();
      const v = document.createElement('video');
      v.src = URL.createObjectURL(blob);
      v.muted = true;
      v.playsInline = true;
      v.autoplay = true;
      if (this.hasAttribute('controls')) {
        v.controls = true;
        v.muted = false;
        v.autoplay = false;

        const goFs = () => {

      this._video = v;
      this._zone.style.display = 'none';
      this._clear.classList.add('on');
    }
    _showEmpty() {
      if (this._video) { this._video.remove(); this._video = null; }
      this._zone.style.display = 'grid';
      this._clear.classList.remove('on');
    }
  }

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {

  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );

  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };

  const PAD = 16;

    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };

    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);
